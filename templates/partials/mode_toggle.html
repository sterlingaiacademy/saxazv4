{# Light / dark / reading switch. `extra_class`: "is-on-light" when it sits on a white background. #}
{% macro mode_toggle(extra_class='') %}
<div class="sx-mode {{ extra_class }}"
     x-data="{ open: false, mode: (window.sxGetMode ? window.sxGetMode() : 'light') }"
     @sx-mode-change.window="mode = $event.detail.mode"
     @click.outside="open = false"
     @keydown.escape.window="open = false">
  <button type="button" class="sx-mode-btn" @click="open = !open" :aria-expanded="open ? 'true' : 'false'"
          aria-label="Display mode: light, dark or reading" title="Light, dark or reading mode">
    <svg x-show="mode === 'light'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
    <svg x-show="mode === 'dark'" x-cloak viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
    <svg x-show="mode === 'reading'" x-cloak viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5C5.5 4.3 8.6 4.3 12 6c3.4-1.7 6.5-1.7 9 -.5V19c-2.5-1.2-5.6-1.2-9 .5-3.4-1.7-6.5-1.7-9-.5z"/><path d="M12 6v13.5"/></svg>
  </button>
  <div class="sx-mode-menu" x-show="open" x-cloak x-transition.opacity.duration.120ms role="menu">
    <div class="sx-mode-menu-title">Display</div>
    <button type="button" class="sx-mode-opt" :class="mode === 'light' && 'is-on'" role="menuitemradio" :aria-checked="mode === 'light'" @click="window.sxSetMode('light'); open = false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      <span>Light<small>Bright and clear</small></span>
      <span class="sx-mode-check" x-show="mode === 'light'" aria-hidden="true">&#10003;</span>
    </button>
    <button type="button" class="sx-mode-opt" :class="mode === 'dark' && 'is-on'" role="menuitemradio" :aria-checked="mode === 'dark'" @click="window.sxSetMode('dark'); open = false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
      <span>Dark<small>Easy on the eyes at night</small></span>
      <span class="sx-mode-check" x-show="mode === 'dark'" aria-hidden="true">&#10003;</span>
    </button>
    <button type="button" class="sx-mode-opt" :class="mode === 'reading' && 'is-on'" role="menuitemradio" :aria-checked="mode === 'reading'" @click="window.sxSetMode('reading'); open = false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5C5.5 4.3 8.6 4.3 12 6c3.4-1.7 6.5-1.7 9 -.5V19c-2.5-1.2-5.6-1.2-9 .5-3.4-1.7-6.5-1.7-9-.5z"/><path d="M12 6v13.5"/></svg>
      <span>Reading<small>Warm paper, less glare</small></span>
      <span class="sx-mode-check" x-show="mode === 'reading'" aria-hidden="true">&#10003;</span>
    </button>
  </div>
</div>
{% endmacro %}
