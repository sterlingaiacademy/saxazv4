<!-- Digital Scratchpad Partial (SAXAZ Clean Diagram Studio) -->
<div x-data="digitalScratchpad()">

  <!-- Scratchpad Floating Panel -->
  <div x-show="isOpen" x-cloak
       @mousedown="bringToFront()"
       @touchstart.passive="bringToFront()"
       x-transition:enter="transition duration-200 ease-out"
       x-transition:enter-start="opacity-0 scale-95 -translate-y-2"
       x-transition:enter-end="opacity-100 scale-100 translate-y-0"
       x-transition:leave="transition duration-150 ease-in"
       x-transition:leave-start="opacity-100 scale-100 translate-y-0"
       x-transition:leave-end="opacity-0 scale-95 -translate-y-2"
       data-sx-paper class="scratchpad-panel fixed rounded-3xl overflow-hidden pointer-events-auto flex flex-col select-none"
       :style="{ position: 'fixed', zIndex: panelZ, display: isOpen ? 'flex' : 'none', top: pos.y + 'px', left: pos.x + 'px', width: boxSize.width + 'px', height: boxSize.height + 'px' }"
       @click.stop>
    
    <!-- 1. Top Bar (Drag Handle + Close) -->
    <div @mousedown="startDrag($event)" 
         @touchstart.passive="startTouchDrag($event)"
         class="scratchpad-header px-3.5 py-2.5 flex justify-between items-center gap-2 cursor-move select-none shrink-0">
      
      <!-- Brand / Title -->
      <div class="flex items-center gap-2.5 shrink-0">
        <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background: #f7b317; color: #231f20;">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
          </svg>
        </div>
        <div>
          <span class="scratchpad-title font-extrabold text-sm sm:text-[15px] tracking-tight block leading-tight" style="color: #231f20;">Scratchpad</span>
          <span class="text-[11px] font-semibold block leading-tight mt-0.5" style="color: rgba(35,31,32,0.55);">Draw your diagram, then tap Attach</span>
        </div>
      </div>

      <!-- AI Blueprint Controls Strictly Disabled on Exam Pages -->
      <div x-show="false" aria-hidden="true"></div>

      <!-- Close Button (Strokes stay saved in canvas memory) -->
      <div class="flex items-center gap-1.5 shrink-0" @mousedown.stop @touchstart.stop>
        <button type="button"
                @click="requestCloseScratchpad()"
                class="scratchpad-close-btn w-9 h-9 rounded-full flex items-center justify-center cursor-pointer transition-colors"
                style="background: #f1f1f2; color: #231f20;"
                title="Close Scratchpad (your strokes stay saved)">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
    </div>

    <!-- 2. Clean White Drawing Canvas Area -->
    <div class="scratchpad-canvas-wrap flex-1 relative overflow-hidden" 
         x-ref="canvasContainer"
         style="touch-action: none; background-color: #ffffff;">
      
      <!-- Background Canvas (Reserved for non-exam playback if ever used) -->
      <canvas x-ref="tutorCanvas"
              class="absolute inset-0 w-full h-full block bg-transparent pointer-events-none"></canvas>

      <!-- Student Freehand / Shape Canvas -->
      <canvas x-ref="scratchCanvas" x-effect="applyPenCursor($el, activeColorKey, isEraser, brushSize)" 
              class="relative z-10 w-full h-full block bg-transparent"
              @pointerdown="startStroke($event)"
              @pointermove="drawStroke($event)"
              @pointerup="stopStroke($event)"
              @pointercancel="stopStroke($event)"
              @pointerleave="stopStroke($event)"></canvas>

      <!-- Floating Toast Badge Inside Canvas -->
      <div x-show="toastMessage" x-cloak
           x-transition.opacity
           class="pointer-events-none absolute top-3 left-1/2 -translate-x-1/2 z-30 px-3.5 py-1.5 rounded-full text-[11px] font-extrabold flex items-center gap-1.5 whitespace-nowrap"
           style="background: #231f20; color: #f7b317; border: 1.5px solid #f7b317;">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span x-text="toastMessage"></span>
      </div>
    </div>

    <!-- 3. Bottom Studio Dock (4 Swatches, 3 Brush Dots, Pen/Line/Circle, Undo, Eraser, Clear, Attach & Resize) -->
    <div class="scratchpad-toolbar px-3 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0">
      
      <!-- Left: 4 Crisp Diagram Color Swatches (#231f20, #f7b317, #dc2626, #16a34a) -->
      <div class="scratchpad-dock-pill flex items-center gap-1.5 px-2.5 py-1 rounded-full shrink-0" style="background: #ffffff; border: 1px solid rgba(35,31,32,0.14);">
        <template x-for="swatch in colorSwatches" :key="swatch.key">
          <button type="button"
                  @click="setColor(swatch.key)"
                  class="transition-transform cursor-pointer shrink-0 rounded-full"
                  :class="activeColorKey === swatch.key && !isEraser ? 'scale-125' : 'opacity-85 hover:opacity-100'"
                  :style="`width: 18px; height: 18px; background-color: ${swatch.hex}; border: ${activeColorKey === swatch.key && !isEraser ? '2.5px solid #231f20' : '1.5px solid rgba(35,31,32,0.28)'}; box-shadow: ${activeColorKey === swatch.key && !isEraser ? '0 0 0 2px #f7b317' : 'none'};`"
                  :title="swatch.label"></button>
        </template>
      </div>

      <!-- Brush Thickness Dots + Shape Tools -->
      <div class="scratchpad-dock-pill flex items-center gap-1 px-2.5 py-1 rounded-full shrink-0"
           style="background: #ffffff; border: 1.5px solid rgba(35,31,32,0.22);">
        <!-- 3 Brush Size Dots -->
        <button type="button" @click="brushSize = 2; isEraser = false" class="w-5 h-5 rounded-full flex items-center justify-center cursor-pointer" :style="brushSize === 2 && !isEraser ? 'background: #f7b317;' : 'background: transparent;'" title="Fine stroke">
          <span class="rounded-full" style="width: 4px; height: 4px; background: #231f20;"></span>
        </button>
        <button type="button" @click="brushSize = 4; isEraser = false" class="w-5 h-5 rounded-full flex items-center justify-center cursor-pointer" :style="brushSize === 4 && !isEraser ? 'background: #f7b317;' : 'background: transparent;'" title="Medium stroke">
          <span class="rounded-full" style="width: 7px; height: 7px; background: #231f20;"></span>
        </button>
        <button type="button" @click="brushSize = 8; isEraser = false" class="w-5 h-5 rounded-full flex items-center justify-center cursor-pointer" :style="brushSize === 8 && !isEraser ? 'background: #f7b317;' : 'background: transparent;'" title="Bold stroke">
          <span class="rounded-full" style="width: 10px; height: 10px; background: #231f20;"></span>
        </button>

        <span class="w-[1px] h-3.5 mx-0.5" style="background: rgba(35,31,32,0.2);"></span>

        <!-- Freehand / Line / Circle Tools -->
        <button type="button" @click="drawTool = 'pen'; isEraser = false" class="w-6 h-5 rounded-full flex items-center justify-center cursor-pointer" :style="drawTool === 'pen' && !isEraser ? 'background: #f7b317; color: #231f20;' : 'color: #231f20;'" title="Freehand Pen">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
        </button>
        <button type="button" @click="drawTool = 'line'; isEraser = false" class="w-6 h-5 rounded-full flex items-center justify-center cursor-pointer" :style="drawTool === 'line' && !isEraser ? 'background: #f7b317; color: #231f20;' : 'color: #231f20;'" title="Straight Line Tool">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="19" x2="19" y2="5" stroke-linecap="round"/><circle cx="5" cy="19" r="1.5" fill="currentColor"/><circle cx="19" cy="5" r="1.5" fill="currentColor"/></svg>
        </button>
        <button type="button" @click="drawTool = 'circle'; isEraser = false" class="w-6 h-5 rounded-full flex items-center justify-center cursor-pointer" :style="drawTool === 'circle' && !isEraser ? 'background: #f7b317; color: #231f20;' : 'color: #231f20;'" title="Circle Tool">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="8"/></svg>
        </button>
      </div>

      <!-- Right Controls: Undo, Eraser, Clear, Attach & Resize -->
      <div class="flex items-center gap-1.5 ml-auto">
        <button @click="undoStroke()"
                type="button"
                class="scratchpad-icon-btn w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition-colors shrink-0"
                style="background: #ffffff; color: #231f20; border: 1.5px solid rgba(35,31,32,0.28);"
                title="Undo last stroke (Ctrl+Z)">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        </button>

        <button @click="toggleEraser()" 
                type="button"
                class="scratchpad-icon-btn w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition-all shrink-0"
                :style="isEraser ? 'background: #f7b317; color: #231f20; border: 1.5px solid #231f20;' : 'background: #ffffff; color: #231f20; border: 1.5px solid rgba(35,31,32,0.28);'"
                title="Eraser">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
        </button>

        <button @click="clearSmart()" 
                type="button"
                class="scratchpad-icon-btn w-7 h-7 rounded-full flex items-center justify-center cursor-pointer transition-colors shrink-0"
                style="background: #ffffff; color: #231f20; border: 1.5px solid #231f20;"
                title="Clear canvas">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </button>

        <button x-show="!isRealExamPage"
                @click="sendDrawingToTutor(true)" 
                type="button"
                class="px-2.5 py-1.5 rounded-full text-[10px] font-black uppercase tracking-wider flex items-center gap-1 transition-transform active:scale-95 cursor-pointer shrink-0"
                style="background: #ffffff; color: #231f20; border: 1.5px solid #231f20;" 
                title="Send your sketch to Ask Tutor for feedback">
          <span>Ask Tutor</span>
        </button>

        <button @click="attachDrawingToAnswer()" 
                type="button"
                class="px-3.5 py-1.5 rounded-full text-[11px] font-black uppercase tracking-wider flex items-center gap-1.5 transition-transform active:scale-95 cursor-pointer shrink-0"
                style="background: #f7b317; color: #231f20; border: 0;"
                title="Attach your drawing to your answer">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          <span>Attach to Answer</span>
        </button>

        <!-- Corner Drag-Resize Handle -->
        <div @mousedown.stop.prevent="startResize($event)" 
             class="scratchpad-resize-btn hidden sm:flex w-6 h-6 rounded-full items-center justify-center cursor-se-resize select-none shrink-0"
             style="background: #ffffff; color: #231f20; border: 1.5px solid rgba(35,31,32,0.28);"
             title="Drag to resize Scratchpad">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 transform rotate-45" viewBox="0 0 20 20" fill="currentColor">
            <path d="M6 4a1 1 0 011 1v10a1 1 0 11-2 0V5a1 1 0 011-1zm6 0a1 1 0 011 1v10a1 1 0 11-2 0V5a1 1 0 011-1z" />
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden Programmatic Trigger (Permanent floating right-edge dock is hidden to prevent distraction) -->
  <div id="scratchpad-dock-wrap" style="display: none !important;" aria-hidden="true">
    <button id="scratchpad-dock-btn" type="button" @click="toggleScratchpad()" tabindex="-1">Scratchpad</button>
  </div>
</div>

<style>
#scratchpad-dock-wrap {
  display: none !important;
}
.scratchpad-panel {
  background-color: #ffffff !important;
  border: 1px solid rgba(35, 31, 32, 0.12) !important;
  border-radius: 24px !important;
  box-shadow: 0 24px 60px rgba(35, 31, 32, 0.18) !important;
  color: #231f20;
}
.scratchpad-header {
  background: #ffffff !important;
  border-bottom: 1px solid rgba(35, 31, 32, 0.08) !important;
  padding-top: 12px !important;
  padding-bottom: 12px !important;
}
.scratchpad-close-btn:hover { background: #e6e6e8 !important; }
.scratchpad-toolbar {
  background: #ffffff !important;
  border-top: 1px solid rgba(35, 31, 32, 0.08) !important;
}
/* Dotted drawing pad (the attached image is exported on plain white) */
.scratchpad-canvas-wrap {
  background-color: #ffffff !important;
  background-image: radial-gradient(rgba(35, 31, 32, 0.22) 1.3px, transparent 1.6px) !important;
  background-size: 20px 20px !important;
  background-position: 10px 10px !important;
}
.scratchpad-icon-btn { background: #f1f1f2 !important; border: 0 !important; color: #231f20 !important; }
@media (max-width: 640px) {
  .scratchpad-panel {
    position: fixed !important;
    top: auto !important;
    bottom: 8px !important;
    left: 8px !important;
    right: 8px !important;
    width: auto !important;
    max-width: calc(100vw - 16px) !important;
    height: 75dvh !important;
    max-height: 78dvh !important;
    margin: 0 auto !important;
    border-radius: 1.5rem !important;
  }
}
</style>

<script>
function digitalScratchpad() {
  return {
    isOpen: false,
    panelZ: 1212,
    pos: { x: 0, y: 0 },
    boxSize: { width: 620, height: 500 },
    dragging: false,
    resizing: false,
    dragOffset: { x: 0, y: 0 },
    resizeStart: { x: 0, y: 0, width: 0, height: 0 },
    toastMessage: '',
    toastTimeout: null,

    isRealExamPage: window.location.pathname.includes('/real-exams/'),
    isExamPage: true,

    colorSwatches: [
      { key: '#231f20', hex: '#231f20', label: 'Black Ink' },
      { key: '#f7b317', hex: '#f7b317', label: 'Yellow Highlight' },
      { key: '#dc2626', hex: '#dc2626', label: 'Red Label' },
      { key: '#16a34a', hex: '#16a34a', label: 'Green Label' }
    ],
    activeColorKey: '#231f20',
    drawTool: 'pen',
    isEraser: false,
    brushSize: 4,
    isDrawing: false,
    ctx: null,
    tutorCtx: null,
    canvasLogicalW: 620,
    canvasLogicalH: 400,
    lastX: 0,
    lastY: 0,
    shapeStartX: 0,
    shapeStartY: 0,
    shapeSnapshot: null,
    undoStack: [],
    hasUserStrokes: false,

    bringToFront() {
      window.__saxazFloatingToolZCounter = Math.max(1210, (window.__saxazFloatingToolZCounter || 1210) + 1);
      this.panelZ = window.__saxazFloatingToolZCounter;
    },

    showToast(msg) {
      this.toastMessage = msg;
      if (this.toastTimeout) clearTimeout(this.toastTimeout);
      this.toastTimeout = setTimeout(() => { this.toastMessage = ''; }, 2400);
    },

    saveUndoState() {
      const canvas = this.$refs.scratchCanvas;
      if (!canvas || canvas.width === 0 || canvas.height === 0) return;
      try {
        if (this.undoStack.length >= 20) this.undoStack.shift();
        this.undoStack.push({
          dataUrl: canvas.toDataURL('image/png'),
          hasUserStrokes: this.hasUserStrokes
        });
      } catch (e) {}
    },

    undoStroke() {
      if (!this.undoStack.length) {
        this.showToast('Nothing to undo');
        return;
      }
      const prev = this.undoStack.pop();
      const prevUrl = typeof prev === 'string' ? prev : prev.dataUrl;
      this.hasUserStrokes = typeof prev === 'object' ? Boolean(prev.hasUserStrokes) : (this.undoStack.length > 0);
      const canvas = this.$refs.scratchCanvas;
      if (!canvas || !this.ctx) return;
      const img = new Image();
      img.onload = () => {
        this.ctx.save();
        this.ctx.setTransform(1, 0, 0, 1, 0, 0);
        this.ctx.clearRect(0, 0, canvas.width, canvas.height);
        this.ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        this.ctx.restore();
      };
      img.src = prevUrl;
    },

    buildCompositeExport() {
      const userCanvas = this.$refs.scratchCanvas;
      if (!userCanvas) return null;

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = userCanvas.width;
      exportCanvas.height = userCanvas.height;
      const expCtx = exportCanvas.getContext('2d');

      expCtx.fillStyle = '#ffffff';
      expCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
      expCtx.drawImage(userCanvas, 0, 0);

      return {
        dataUrl: exportCanvas.toDataURL('image/png'),
        traceMode: false,
        blueprintTitle: '',
        hasUserStrokes: Boolean(this.hasUserStrokes),
        hasTutorBlueprint: false
      };
    },

    attachDrawingToAnswer() {
      if (!this.hasUserStrokes) {
        this.showToast('Please draw your diagram on the canvas first!');
        return;
      }
      const payload = this.buildCompositeExport();
      if (!payload) return;
      window.dispatchEvent(new CustomEvent('scratchpad-attach-drawing', { detail: payload }));
      this.showToast('Drawing attached to your answer!');
      this.requestCloseScratchpad();
    },

    sendDrawingToTutor(autoSend = false) {
      if (!this.hasUserStrokes) {
        this.showToast('Please draw on the canvas first!');
        return;
      }
      const payload = this.buildCompositeExport();
      if (!payload) return;
      payload.autoSend = Boolean(autoSend);
      window.dispatchEvent(new CustomEvent('scratchpad-send-to-tutor', { detail: payload }));
      this.showToast('Sent drawing to Ask Tutor!');
    },

    init() {
      if (window.innerWidth <= 640) {
        this.boxSize.width = Math.max(300, window.innerWidth - 16);
      }

      window.addEventListener('mousemove', (e) => {
        if (this.resizing) {
          const deltaX = e.clientX - this.resizeStart.x;
          const deltaY = e.clientY - this.resizeStart.y;
          const newWidth = Math.max(360, Math.min(window.innerWidth - 32, this.resizeStart.width + deltaX));
          const newHeight = Math.max(320, Math.min(window.innerHeight - 60, this.resizeStart.height + deltaY));
          this.boxSize = { width: newWidth, height: newHeight };
          this.$nextTick(() => this.resizeCanvas());
          return;
        }

        if (this.dragging) {
          let newX = e.clientX - this.dragOffset.x;
          let newY = e.clientY - this.dragOffset.y;
          newX = Math.max(10, Math.min(newX, window.innerWidth - 150));
          newY = Math.max(10, Math.min(newY, window.innerHeight - 80));
          this.pos = { x: newX, y: newY };
        }
      });

      window.addEventListener('mouseup', () => {
        this.dragging = false;
        this.resizing = false;
      });

      window.addEventListener('touchmove', (e) => {
        if (this.dragging && e.touches && e.touches.length === 1) {
          const touch = e.touches[0];
          let newX = touch.clientX - this.dragOffset.x;
          let newY = touch.clientY - this.dragOffset.y;
          newX = Math.max(10, Math.min(newX, window.innerWidth - 150));
          newY = Math.max(10, Math.min(newY, window.innerHeight - 80));
          this.pos = { x: newX, y: newY };
        }
      }, { passive: true });

      window.addEventListener('touchend', () => {
        this.dragging = false;
        this.resizing = false;
      });

      window.addEventListener('keydown', (e) => {
        if (this.isOpen && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
          if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;
          e.preventDefault();
          this.undoStroke();
        }
      });

      window.addEventListener('resize', () => {
        if (window.innerWidth <= 640) {
          this.boxSize.width = Math.max(300, window.innerWidth - 16);
        }
        if (this.isOpen) {
          this.$nextTick(() => this.resizeCanvas());
        }
      });

      window.addEventListener('toggle-scratchpad', () => {
        this.toggleScratchpad();
      });
    },

    centerScratchpad() {
      const panelWidth = Math.min(this.boxSize.width, window.innerWidth - 32);
      const panelHeight = Math.min(this.boxSize.height, window.innerHeight - 80);
      const miniTutorOpen = document.body.classList.contains('mini-tutor-open') && window.innerWidth >= 1024;
      const availableWidth = miniTutorOpen ? Math.max(panelWidth + 32, window.innerWidth - 430) : window.innerWidth;
      const startX = Math.max(16, Math.round((availableWidth - panelWidth) / 2));
      const startY = Math.max(68, Math.round((window.innerHeight - panelHeight) / 2));
      this.pos = { x: startX, y: startY };
    },

    requestCloseScratchpad() {
      this.isOpen = false;
      document.body.classList.remove('scratchpad-open');
    },

    toggleScratchpad() {
      if (this.isOpen) {
        this.requestCloseScratchpad();
        return;
      }
      if (window.innerWidth <= 640) {
        this.boxSize.width = Math.max(300, window.innerWidth - 16);
      }
      this.isOpen = true;
      this.bringToFront();
      document.body.classList.add('scratchpad-open');
      if (this.pos.x === 0 && this.pos.y === 0) {
        this.centerScratchpad();
      }
      this.$nextTick(() => {
        setTimeout(() => this.resizeCanvas(), 30);
      });
    },

    startDrag(e) {
      if (e.target.closest('button') || e.target.closest('input') || e.target.closest('form')) return;
      this.bringToFront();
      this.dragging = true;
      this.dragOffset = {
        x: e.clientX - this.pos.x,
        y: e.clientY - this.pos.y
      };
    },

    startTouchDrag(e) {
      if (e.target.closest('button') || e.target.closest('input') || e.target.closest('form') || !e.touches || e.touches.length !== 1) return;
      this.bringToFront();
      this.dragging = true;
      const touch = e.touches[0];
      this.dragOffset = {
        x: touch.clientX - this.pos.x,
        y: touch.clientY - this.pos.y
      };
    },

    startResize(e) {
      this.bringToFront();
      this.resizing = true;
      this.resizeStart = {
        x: e.clientX,
        y: e.clientY,
        width: this.boxSize.width,
        height: this.boxSize.height
      };
    },

    setColor(key) {
      this.activeColorKey = key;
      this.isEraser = false;
    },

    // Pencil cursor: the nib takes the selected colour; the eraser shows a ring the size of the rubber
    applyPenCursor(el, color, eraser, size) {
      if (!el) return;
      let svg, hot;
      if (eraser) {
        const r = Math.max(6, Math.min(14, (size || 4) * 2.5));
        svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="${r}" fill="rgba(255,255,255,0.6)" stroke="#231f20" stroke-width="1.6"/><circle cx="16" cy="16" r="1.2" fill="#231f20"/></svg>`;
        hot = '16 16';
      } else {
        const nib = /^#[0-9a-f]{3,8}$/i.test(String(color || '')) ? color : '#231f20';
        svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><g transform="rotate(45 16 16)">`
          + `<rect x="12" y="1" width="8" height="5" rx="1.5" fill="#231f20"/>`
          + `<rect x="12" y="5.5" width="8" height="14.5" fill="#f7b317" stroke="#231f20" stroke-width="1.4"/>`
          + `<path d="M12 20 L20 20 L16 30.5 Z" fill="#f6dcb0" stroke="#231f20" stroke-width="1.4" stroke-linejoin="round"/>`
          + `<path d="M14.1 25 L17.9 25 L16 30.5 Z" fill="${nib}" stroke="#231f20" stroke-width="0.9" stroke-linejoin="round"/>`
          + `</g></svg>`;
        hot = '6 26';
      }
      const url = 'data:image/svg+xml,' + encodeURIComponent(svg);
      el.style.setProperty('cursor', `url("${url}") ${hot}, crosshair`, 'important');
    },

    toggleEraser() {
      this.isEraser = !this.isEraser;
    },

    resizeCanvas(skipUserRestore = false) {
      if (window.innerWidth <= 640) {
        this.boxSize.width = Math.max(300, window.innerWidth - 16);
      }
      const userCanvas = this.$refs.scratchCanvas;
      const tutorCanvas = this.$refs.tutorCanvas;
      const container = this.$refs.canvasContainer;
      if (!userCanvas || !container) return;

      const rect = container.getBoundingClientRect();
      const width = rect.width > 0 ? rect.width : (this.boxSize.width || 620);
      const height = rect.height > 0 ? rect.height : (this.boxSize.height - 96 || 400);
      this.canvasLogicalW = width;
      this.canvasLogicalH = height;

      let tempUserCanvas = null;
      if (!skipUserRestore && userCanvas.width > 0 && userCanvas.height > 0 && this.hasUserStrokes) {
        tempUserCanvas = document.createElement('canvas');
        tempUserCanvas.width = userCanvas.width;
        tempUserCanvas.height = userCanvas.height;
        tempUserCanvas.getContext('2d').drawImage(userCanvas, 0, 0);
      }

      const dpr = window.devicePixelRatio || 1;

      userCanvas.width = Math.round(width * dpr);
      userCanvas.height = Math.round(height * dpr);
      userCanvas.style.width = width + 'px';
      userCanvas.style.height = height + 'px';

      this.ctx = userCanvas.getContext('2d');
      this.ctx.setTransform(1, 0, 0, 1, 0, 0);
      this.ctx.scale(dpr, dpr);
      this.ctx.lineCap = 'round';
      this.ctx.lineJoin = 'round';

      if (tempUserCanvas) {
        this.ctx.drawImage(tempUserCanvas, 0, 0, width, height);
      }

      if (tutorCanvas) {
        tutorCanvas.width = Math.round(width * dpr);
        tutorCanvas.height = Math.round(height * dpr);
        tutorCanvas.style.width = width + 'px';
        tutorCanvas.style.height = height + 'px';
        this.tutorCtx = tutorCanvas.getContext('2d');
      }
    },

    clearUserCanvas() {
      const canvas = this.$refs.scratchCanvas;
      if (!canvas || !this.ctx) return;
      this.ctx.save();
      this.ctx.setTransform(1, 0, 0, 1, 0, 0);
      this.ctx.clearRect(0, 0, canvas.width, canvas.height);
      this.ctx.restore();
      this.hasUserStrokes = false;
    },

    async clearSmart() {
      if (!this.hasUserStrokes) {
        this.clearUserCanvas();
        this.showToast('Canvas is already clear');
        return;
      }
      const res = await window.saxazConfirm({
        title: 'Clear Your Drawing?',
        text: 'Erase your strokes from the Scratchpad? (You can still press Undo if needed.)',
        tone: 'danger',
        icon: 'delete',
        confirmButtonText: 'Yes, Clear',
        cancelButtonText: 'Keep Drawing'
      });
      if (!res.isConfirmed) return;
      this.saveUndoState();
      this.clearUserCanvas();
      this.showToast('Canvas cleared');
    },

    getCanvasPos(e) {
      const rect = this.$refs.scratchCanvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    },

    startStroke(e) {
      if (!this.ctx) this.resizeCanvas();
      this.saveUndoState();
      this.isDrawing = true;
      this.hasUserStrokes = true;
      const pos = this.getCanvasPos(e);
      this.lastX = pos.x;
      this.lastY = pos.y;
      this.shapeStartX = pos.x;
      this.shapeStartY = pos.y;
      if (!this.isEraser && (this.drawTool === 'line' || this.drawTool === 'circle')) {
        const canvas = this.$refs.scratchCanvas;
        this.shapeSnapshot = this.ctx.getImageData(0, 0, canvas.width, canvas.height);
      } else {
        this.shapeSnapshot = null;
      }
    },

    drawStroke(e) {
      if (!this.isDrawing || !this.ctx) return;
      const pos = this.getCanvasPos(e);
      const strokeColor = this.activeColorKey || '#231f20';

      if (!this.isEraser && this.shapeSnapshot && (this.drawTool === 'line' || this.drawTool === 'circle')) {
        this.ctx.putImageData(this.shapeSnapshot, 0, 0);
        this.ctx.globalCompositeOperation = 'source-over';
        this.ctx.strokeStyle = strokeColor;
        this.ctx.lineWidth = this.brushSize;
        this.ctx.beginPath();
        if (this.drawTool === 'line') {
          this.ctx.moveTo(this.shapeStartX, this.shapeStartY);
          this.ctx.lineTo(pos.x, pos.y);
        } else if (this.drawTool === 'circle') {
          const r = Math.hypot(pos.x - this.shapeStartX, pos.y - this.shapeStartY);
          this.ctx.arc(this.shapeStartX, this.shapeStartY, r, 0, Math.PI * 2);
        }
        this.ctx.stroke();
        return;
      }

      this.ctx.beginPath();
      this.ctx.moveTo(this.lastX, this.lastY);
      this.ctx.lineTo(pos.x, pos.y);

      if (this.isEraser) {
        this.ctx.globalCompositeOperation = 'destination-out';
        this.ctx.lineWidth = this.brushSize * 5;
      } else {
        this.ctx.globalCompositeOperation = 'source-over';
        this.ctx.strokeStyle = strokeColor;
        this.ctx.lineWidth = this.brushSize;
      }

      this.ctx.stroke();
      this.lastX = pos.x;
      this.lastY = pos.y;
    },

    stopStroke() {
      this.isDrawing = false;
      this.shapeSnapshot = null;
      if (this.ctx) {
        this.ctx.globalCompositeOperation = 'source-over';
      }
    }
  };
}
</script>
