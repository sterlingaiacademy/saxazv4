          const numSteps = Math.max(4, Math.min(18, Math.round(dist / 10)));
          let prevX = x1;
          let prevY = y1;
          ctx.save();
          ctx.strokeStyle = col;
          ctx.lineWidth = Number(step.width) || 2.5;
          ctx.setLineDash(Array.isArray(step.dash) ? step.dash : []);
          for (let i = 1; i <= numSteps; i++) {
            if (aborted()) {
              ctx.restore();
              return;
            }
            const t = i / numSteps;
            const currX = (1 - t) * (1 - t) * x1 + 2 * (1 - t) * t * cx + t * t * x2;
            const currY = (1 - t) * (1 - t) * y1 + 2 * (1 - t) * t * cy + t * t * y2;
            ctx.beginPath();
            ctx.moveTo(prevX, prevY);
            ctx.lineTo(currX, currY);
            ctx.stroke();
            prevX = currX;
            prevY = currY;
            this.penPos = { x: currX, y: currY };
            await delay(10);
          }
          ctx.restore();
          if (aborted()) return;
          this.renderSingleStepSync(step, m);
          await delay(10);
          break;
        }

        case 'bezier': {
          const x1 = sx(step.startX);
          const y1 = sy(step.startY);
          const c1x = sx(step.cp1X);
          const c1y = sy(step.cp1Y);
          const c2x = sx(step.cp2X);
          const c2y = sy(step.cp2Y);
          const x2 = sx(step.endX);
          const y2 = sy(step.endY);
          const col = step.color || this.activePenColor;
          this.activePenColor = col;

          const dist = Math.hypot(x2 - x1, y2 - y1) + Math.hypot(c1x - x1, c1y - y1) + Math.hypot(c2x - c1x, c2y - c1y);
          const numSteps = Math.max(5, Math.min(20, Math.round(dist / 10)));
          let prevX = x1;
          let prevY = y1;
          ctx.save();
          ctx.strokeStyle = col;
          ctx.lineWidth = Number(step.width) || 2.5;
          ctx.setLineDash(Array.isArray(step.dash) ? step.dash : []);
          for (let i = 1; i <= numSteps; i++) {
            if (aborted()) {
              ctx.restore();
              return;
            }
            const t = i / numSteps;
            const currX = Math.pow(1 - t, 3) * x1 + 3 * Math.pow(1 - t, 2) * t * c1x + 3 * (1 - t) * Math.pow(t, 2) * c2x + Math.pow(t, 3) * x2;
            const currY = Math.pow(1 - t, 3) * y1 + 3 * Math.pow(1 - t, 2) * t * c1y + 3 * (1 - t) * Math.pow(t, 2) * c2y + Math.pow(t, 3) * y2;
            ctx.beginPath();
            ctx.moveTo(prevX, prevY);
            ctx.lineTo(currX, currY);
            ctx.stroke();
            prevX = currX;
            prevY = currY;
            this.penPos = { x: currX, y: currY };
            await delay(10);
          }
          ctx.restore();
          if (aborted()) return;
          this.renderSingleStepSync(step, m);
          await delay(10);
          break;
        }

        case 'path': {
          if (!step.points || step.points.length < 2) break;
          const pts = step.points.map(p => ({ x: sx(p.x), y: sy(p.y) }));
          const col = step.color || this.activePenColor;
          const width = Number(step.width) || 2.5;
          for (let pIdx = 1; pIdx < pts.length; pIdx++) {
            if (aborted()) return;
            await traceLineSegment(pts[pIdx - 1].x, pts[pIdx - 1].y, pts[pIdx].x, pts[pIdx].y, col, width);
          }
          if (aborted()) return;
          if (step.closed && pts.length > 2) {
            await traceLineSegment(pts[pts.length - 1].x, pts[pts.length - 1].y, pts[0].x, pts[0].y, col, width);
          }
          if (aborted()) return;
          this.renderSingleStepSync(step, m);
          await delay(10);
          break;
        }

        case 'circle': {
          const cx = sx(step.x);
          const cy = sy(step.y);
          const r = sr(step.radius);
          const col = step.color || this.activePenColor;
          this.activePenColor = col;

          const segs = 16;
          let prevX = cx + r;
          let prevY = cy;
          ctx.save();
          ctx.strokeStyle = col;
          ctx.lineWidth = Number(step.width) || 2.5;
          ctx.setLineDash([]);
          for (let i = 1; i <= segs; i++) {
            if (aborted()) {
              ctx.restore();
              return;
            }
            const angle = (i / segs) * Math.PI * 2;
            const currX = cx + r * Math.cos(angle);
            const currY = cy + r * Math.sin(angle);
            ctx.beginPath();
            ctx.moveTo(prevX, prevY);
            ctx.lineTo(currX, currY);
            ctx.stroke();
            prevX = currX;
            prevY = currY;
            this.penPos = { x: currX, y: currY };
            await delay(9);
          }
          ctx.restore();
          if (aborted()) return;
          this.renderSingleStepSync(step, m);
          await delay(10);
          break;
        }

        case 'arc': {
          const cx = sx(step.x);
          const cy = sy(step.y);
          const r = sr(step.radius);
          const startAng = Number(step.startAngle) || 0;
          const endAng = Number(step.endAngle) || Math.PI;
          const col = step.color || this.activePenColor;
          this.activePenColor = col;

          const segs = 14;
          let prevX = cx + r * Math.cos(startAng);
          let prevY = cy + r * Math.sin(startAng);
          ctx.save();
          ctx.strokeStyle = col;
          ctx.lineWidth = Number(step.width) || 2.5;
          ctx.setLineDash([]);
          for (let i = 1; i <= segs; i++) {
            if (aborted()) {
              ctx.restore();
              return;
            }
            const angle = startAng + (endAng - startAng) * (i / segs);
            const currX = cx + r * Math.cos(angle);
            const currY = cy + r * Math.sin(angle);
            ctx.beginPath();
            ctx.moveTo(prevX, prevY);
            ctx.lineTo(currX, currY);
            ctx.stroke();
            prevX = currX;
            prevY = currY;
            this.penPos = { x: currX, y: currY };
            await delay(9);
          }
          ctx.restore();
          if (!aborted()) await delay(10);
          break;
        }

        case 'ellipse': {
          const cx = sx(step.x);
          const cy = sy(step.y);
          const rx = sr(step.rx);
          const ry = sr(step.ry);
          const col = step.color || this.activePenColor;
          this.activePenColor = col;

          const segs = 16;
          let prevX = cx + rx;
          let prevY = cy;
          ctx.save();
          ctx.strokeStyle = col;
          ctx.lineWidth = Number(step.width) || 2.5;
          ctx.setLineDash([]);
          for (let i = 1; i <= segs; i++) {
            if (aborted()) {
              ctx.restore();
              return;
            }
            const angle = (i / segs) * Math.PI * 2;
            const currX = cx + rx * Math.cos(angle);
            const currY = cy + ry * Math.sin(angle);
            ctx.beginPath();
            ctx.moveTo(prevX, prevY);
            ctx.lineTo(currX, currY);
            ctx.stroke();
            prevX = currX;
            prevY = currY;
            this.penPos = { x: currX, y: currY };
            await delay(9);
          }
          ctx.restore();
          if (aborted()) return;
          this.renderSingleStepSync(step, m);
          await delay(10);
          break;
        }

        case 'rect': {
          const rx = sx(step.x);
          const ry = sy(step.y);
          const rw = Math.round((Number(step.w) || 0) * m.scaleX);
          const rh = Math.round((Number(step.h) || 0) * m.scaleY);
          const col = step.color || this.activePenColor;
          const width = Number(step.width) || 2.5;
          const pts = [
            { x: rx, y: ry },
            { x: rx + rw, y: ry },
            { x: rx + rw, y: ry + rh },
            { x: rx, y: ry + rh }
          ];
          for (let i = 0; i < 4; i++) {
            if (aborted()) return;
            const next = pts[(i + 1) % 4];
            await traceLineSegment(pts[i].x, pts[i].y, next.x, next.y, col, width);
          }
          if (aborted()) return;
          this.renderSingleStepSync(step, m);
          await delay(10);
          break;
        }

        case 'arrow': {
          const x1 = sx(step.startX);
          const y1 = sy(step.startY);
          const x2 = sx(step.endX);
          const y2 = sy(step.endY);
          const arrowColor = step.color || this.activePenColor;
          await traceLineSegment(x1, y1, x2, y2, arrowColor, Number(step.width) || 2.5);
          if (aborted()) return;
          this.renderSingleStepSync(step, m);
          await delay(12);
          break;
        }

        case 'text': {
          const tx = sx(step.x);
          const ty = sy(step.y);
          this.penPos = { x: tx, y: ty };
          await delay(18);
          if (aborted()) return;
          this.renderSingleStepSync(step, m);
          await delay(12);
          break;
        }
      }
    },

    // -----------------------------------------------------------------
    // Interactive Educational Diagram Drawing Engine (for Tutor & Student)
    // -----------------------------------------------------------------
    drawEducationalDiagram(key, title, silent = false) {
      const canvas = this.$refs.tutorCanvas || this.$refs.scratchCanvas;
      const container = this.$refs.canvasContainer;
      if (!canvas || !container) return;
      if (!this.tutorCtx) this.resizeCanvas();
      
      const ctx = this.tutorCtx || this.ctx;
      const rect = container.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      if (w <= 0 || h <= 0) return;

      const dpr = window.devicePixelRatio || 1;
      ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);

      const theme = document.documentElement.getAttribute('data-theme') || 'light';
      const isDark = ['dark', 'dracula', 'night', 'black', 'saxazdark'].includes(theme);
      const textColor = isDark ? '#f3f4f6' : '#111827';
      const subTextColor = isDark ? '#9ca3af' : '#4b5563';
      const axisColor = isDark ? '#6b7280' : '#9ca3af';
      const mirrorColor = '#3b82f6';
      const ray1Color = '#ef4444'; // Red
      const ray2Color = '#8b5cf6'; // Purple
      const objectColor = '#0284c7'; // Blue
      const imageColor = '#10b981'; // Green
      const virtualRayColor = '#f59e0b'; // Amber / dashed

      const normalizedKey = (key || '').toLowerCase().replace(/[\s-]/g, '_');

      if (normalizedKey.includes('convex_mirror') || (normalizedKey.includes('convex') && normalizedKey.includes('mirror'))) {
        this.renderConvexMirrorDiagram(ctx, w, h, textColor, subTextColor, axisColor, mirrorColor, ray1Color, ray2Color, objectColor, imageColor, virtualRayColor, isDark);
      } else if (normalizedKey.includes('concave_mirror') || (normalizedKey.includes('concave') && normalizedKey.includes('mirror'))) {
        this.renderConcaveMirrorDiagram(ctx, w, h, textColor, subTextColor, axisColor, mirrorColor, ray1Color, ray2Color, objectColor, imageColor, virtualRayColor, isDark);
      } else if (normalizedKey.includes('lens')) {
        this.renderConvexLensDiagram(ctx, w, h, textColor, subTextColor, axisColor, mirrorColor, ray1Color, ray2Color, objectColor, imageColor, virtualRayColor, isDark);
      } else if (normalizedKey.includes('reflection')) {
        this.renderReflectionDiagram(ctx, w, h, textColor, subTextColor, axisColor, ray1Color, imageColor, isDark);
      } else if (normalizedKey.includes('refraction') || normalizedKey.includes('slab')) {
        this.renderRefractionDiagram(ctx, w, h, textColor, subTextColor, axisColor, ray1Color, imageColor, isDark);
      } else if (normalizedKey.includes('triangle') || normalizedKey.includes('pythagoras')) {
        this.renderTriangleDiagram(ctx, w, h, textColor, subTextColor, objectColor, imageColor, isDark);
      } else if (normalizedKey.includes('circle') || normalizedKey.includes('tangent')) {
        this.renderCircleDiagram(ctx, w, h, textColor, subTextColor, objectColor, imageColor, isDark);
      } else {
        this.renderGenericBoard(ctx, w, h, title || 'Tutor Diagram', textColor, subTextColor, axisColor, isDark);
      }
      if (!silent) {
        this.showToast(`Drawn: ${title || 'Diagram'}`);
      }
    },

    renderConvexMirrorDiagram(ctx, w, h, textColor, subTextColor, axisColor, mirrorColor, ray1Color, ray2Color, objectColor, imageColor, virtualRayColor, isDark) {
      ctx.font = 'bold 15px Outfit, sans-serif';
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.fillText('Convex Mirror — Ray Diagram (Virtual & Diminished Image)', w / 2, 26);
      
      ctx.font = '11px Outfit, sans-serif';
      ctx.fillStyle = subTextColor;
      ctx.fillText('Reflective surface bulges outward toward the object on the left', w / 2, 44);

      const cy = Math.round(h * 0.50);
      const cx = Math.round(w * 0.52);
      const scale = Math.min(w / 520, h / 450);

      // Principal Axis
      ctx.beginPath();
      ctx.strokeStyle = axisColor;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([]);
      ctx.moveTo(20, cy);
      ctx.lineTo(w - 20, cy);
      ctx.stroke();

      ctx.font = 'bold 11px Outfit, sans-serif';
      ctx.fillStyle = subTextColor;
      ctx.textAlign = 'right';
      ctx.fillText('Principal Axis', w - 24, cy - 8);

      // Mirror Curve (Arc convex to left)
      const mirrorRadius = 200 * scale;
      const arcCenter = { x: cx + mirrorRadius, y: cy };
      const arcAngle = 0.38;
      
      ctx.beginPath();
      ctx.strokeStyle = mirrorColor;
      ctx.lineWidth = 3.5;
      ctx.arc(arcCenter.x, arcCenter.y, mirrorRadius, Math.PI - arcAngle, Math.PI + arcAngle, false);
      ctx.stroke();

      // Hatching on concave inner side
      ctx.strokeStyle = '#9ca3af';
      ctx.lineWidth = 1.2;
      for (let a = -arcAngle; a <= arcAngle; a += 0.06) {
        const hx = arcCenter.x - mirrorRadius * Math.cos(a);
        const hy = arcCenter.y + mirrorRadius * Math.sin(a);
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(hx + 8 * scale, hy - 6 * scale);
        ctx.stroke();
      }

      const fDist = 75 * scale;
      const cDist = 150 * scale;
      const fx = cx + fDist;
      const cPos = cx + cDist;

      const drawPoint = (x, y, label, labelYOffset = 18) => {
        ctx.beginPath();
        ctx.fillStyle = textColor;
        ctx.arc(x, y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = 'bold 11px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(label, x, y + labelYOffset);
      };

      drawPoint(cx, cy, 'P (Pole)', 18);
      drawPoint(fx, cy, 'F (Focus)', 18);
      drawPoint(cPos, cy, 'C (Center)', 18);

      // Object AB
      const objDist = 130 * scale;
      const objHeight = 65 * scale;
      const ox = cx - objDist;
      const oy = cy - objHeight;

      ctx.beginPath();
      ctx.strokeStyle = objectColor;
      ctx.fillStyle = objectColor;
      ctx.lineWidth = 3;
      ctx.moveTo(ox, cy);
      ctx.lineTo(ox, oy);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ox - 5, oy + 8);
      ctx.lineTo(ox, oy);
      ctx.lineTo(ox + 5, oy + 8);
      ctx.fill();

      ctx.font = 'bold 12px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('A (Object)', ox, oy - 8);
      ctx.fillText('B', ox, cy + 18);

      // Ray 1: Parallel to Axis
      const dy = oy;
      const dx = arcCenter.x - Math.sqrt(mirrorRadius * mirrorRadius - (dy - cy) * (dy - cy));

      ctx.beginPath();
      ctx.strokeStyle = ray1Color;
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
      ctx.moveTo(ox, oy);
      ctx.lineTo(dx, dy);
      ctx.stroke();

      // Reflected Ray
      const slope1 = (dy - cy) / (dx - fx);
      const reflect1EndX = dx - 70 * scale;
      const reflect1EndY = dy - 70 * scale * slope1;

      ctx.beginPath();
      ctx.strokeStyle = ray1Color;
      ctx.moveTo(dx, dy);
      ctx.lineTo(reflect1EndX, reflect1EndY);
      ctx.stroke();

      // Virtual Ray 1 to F
      ctx.beginPath();
      ctx.strokeStyle = virtualRayColor;
      ctx.lineWidth = 1.8;
      ctx.setLineDash([4, 4]);
      ctx.moveTo(dx, dy);
      ctx.lineTo(fx, cy);
      ctx.stroke();

      // Ray 2: Directed towards C
      const slope2 = (cy - oy) / (cPos - ox);
      const ex = cx + 6 * scale;
      const ey = cy - (cPos - ex) * slope2;

      ctx.beginPath();
      ctx.strokeStyle = ray2Color;
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
      ctx.moveTo(ox, oy);
      ctx.lineTo(ex, ey);
      ctx.stroke();

      // Virtual Ray 2 to C
      ctx.beginPath();
      ctx.strokeStyle = virtualRayColor;
      ctx.lineWidth = 1.8;
      ctx.setLineDash([4, 4]);
      ctx.moveTo(ex, ey);
      ctx.lineTo(cPos, cy);
      ctx.stroke();

      // Virtual Image A'B'
      const approxImgX = cx + (fDist * 0.42);
      const approxImgY = cy - (objHeight * 0.42);

      ctx.beginPath();
      ctx.strokeStyle = imageColor;
      ctx.fillStyle = imageColor;
      ctx.lineWidth = 2.5;
      ctx.setLineDash([]);
      ctx.moveTo(approxImgX, cy);
      ctx.lineTo(approxImgX, approxImgY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(approxImgX - 3.5, approxImgY + 6);
      ctx.lineTo(approxImgX, approxImgY);
      ctx.lineTo(approxImgX + 3.5, approxImgY + 6);
      ctx.fill();

      ctx.font = 'bold 11px Outfit, sans-serif';
      ctx.fillStyle = imageColor;
      ctx.fillText("A' (Virtual Image)", approxImgX + 14, approxImgY - 6);
      ctx.fillText("B'", approxImgX + 4, cy + 18);

      // Bottom Summary Card
      ctx.setLineDash([]);
      const boxY = h - 60;
      ctx.fillStyle = isDark ? 'rgba(30, 41, 59, 0.85)' : 'rgba(243, 244, 246, 0.95)';
      ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.08)';
      ctx.lineWidth = 1;
      ctx.roundRect ? ctx.roundRect(14, boxY, w - 28, 50, 10) : ctx.rect(14, boxY, w - 28, 50);
      ctx.fill();
      ctx.stroke();

      ctx.font = 'bold 10.5px Outfit, sans-serif';
      ctx.fillStyle = '#059669';
      ctx.textAlign = 'left';
      ctx.fillText('CONVEX MIRROR PROPERTIES:', 24, boxY + 18);
      ctx.font = '500 10.5px Outfit, sans-serif';
      ctx.fillStyle = subTextColor;
      ctx.fillText('• Virtual & Erect  • Diminished (smaller than object)  • Formed behind mirror between P and F', 24, boxY + 36);
    },

    renderConcaveMirrorDiagram(ctx, w, h, textColor, subTextColor, axisColor, mirrorColor, ray1Color, ray2Color, objectColor, imageColor, virtualRayColor, isDark) {
      ctx.font = 'bold 15px Outfit, sans-serif';
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.fillText('Concave Mirror — Real & Inverted Image', w / 2, 26);
      
      ctx.font = '11px Outfit, sans-serif';
      ctx.fillStyle = subTextColor;
      ctx.fillText('Object placed beyond Center of Curvature (C)', w / 2, 44);

      const cy = Math.round(h * 0.50);
      const cx = Math.round(w * 0.68);
      const scale = Math.min(w / 520, h / 450);

      // Principal axis
      ctx.beginPath();
      ctx.strokeStyle = axisColor;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([]);
      ctx.moveTo(20, cy);
      ctx.lineTo(w - 20, cy);
      ctx.stroke();

      // Concave Mirror (curving inward, center on left)
      const mirrorRadius = 200 * scale;
      const arcCenter = { x: cx - mirrorRadius, y: cy };
      const arcAngle = 0.38;

      ctx.beginPath();
      ctx.strokeStyle = mirrorColor;
      ctx.lineWidth = 3.5;
      ctx.arc(arcCenter.x, arcCenter.y, mirrorRadius, -arcAngle, arcAngle, false);
      ctx.stroke();

      // Hatching on outer right side
      ctx.strokeStyle = '#9ca3af';
      ctx.lineWidth = 1.2;
      for (let a = -arcAngle; a <= arcAngle; a += 0.06) {
        const hx = arcCenter.x + mirrorRadius * Math.cos(a);
        const hy = arcCenter.y + mirrorRadius * Math.sin(a);
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(hx + 8 * scale, hy - 6 * scale);
        ctx.stroke();
      }

      const fDist = 75 * scale;
      const cDist = 150 * scale;
      const fx = cx - fDist;
      const cPos = cx - cDist;

      const drawPoint = (x, y, label) => {
        ctx.beginPath();
        ctx.fillStyle = textColor;
        ctx.arc(x, y, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = 'bold 11px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(label, x, y + 18);
      };

      drawPoint(cx, cy, 'P (Pole)');
      drawPoint(fx, cy, 'F (Focus)');
      drawPoint(cPos, cy, 'C (Center)');

      // Object AB beyond C
      const ox = cPos - 45 * scale;
      const objHeight = 65 * scale;
      const oy = cy - objHeight;

      ctx.beginPath();
      ctx.strokeStyle = objectColor;
      ctx.fillStyle = objectColor;
      ctx.lineWidth = 3;
      ctx.moveTo(ox, cy);
      ctx.lineTo(ox, oy);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ox - 5, oy + 8);
      ctx.lineTo(ox, oy);
      ctx.lineTo(ox + 5, oy + 8);
      ctx.fill();

      ctx.font = 'bold 12px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('A (Object)', ox, oy - 8);
      ctx.fillText('B', ox, cy + 18);

      // Ray 1: Parallel to axis, reflects through F
      const dx = cx - 4 * scale;
      ctx.beginPath();
      ctx.strokeStyle = ray1Color;
      ctx.lineWidth = 2;
      ctx.moveTo(ox, oy);
      ctx.lineTo(dx, oy);
      ctx.lineTo(ox - 40 * scale, cy + 50 * scale);
      ctx.stroke();

      // Real Inverted Image A'B' between C and F
      const imgX = (cPos + fx) / 2;
      const imgHeight = 35 * scale;
      const imgY = cy + imgHeight;

      ctx.beginPath();
      ctx.strokeStyle = imageColor;
      ctx.fillStyle = imageColor;
      ctx.lineWidth = 2.5;
      ctx.moveTo(imgX, cy);
      ctx.lineTo(imgX, imgY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(imgX - 3.5, imgY - 6);
      ctx.lineTo(imgX, imgY);
      ctx.lineTo(imgX + 3.5, imgY - 6);
      ctx.fill();

      ctx.font = 'bold 11px Outfit, sans-serif';
      ctx.fillText("A' (Real Inverted Image)", imgX, imgY + 16);
      ctx.fillText("B'", imgX, cy - 6);

      // Bottom Summary
      const boxY = h - 60;
      ctx.fillStyle = isDark ? 'rgba(30, 41, 59, 0.85)' : 'rgba(243, 244, 246, 0.95)';
      ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.08)';
      ctx.lineWidth = 1;
      ctx.roundRect ? ctx.roundRect(14, boxY, w - 28, 50, 10) : ctx.rect(14, boxY, w - 28, 50);
      ctx.fill();
      ctx.stroke();

      ctx.font = 'bold 10.5px Outfit, sans-serif';
      ctx.fillStyle = '#059669';
      ctx.textAlign = 'left';
      ctx.fillText('CONCAVE MIRROR (Object beyond C):', 24, boxY + 18);
      ctx.font = '500 10.5px Outfit, sans-serif';
      ctx.fillStyle = subTextColor;
      ctx.fillText('• Real & Inverted  • Diminished  • Formed in front of mirror between C and F', 24, boxY + 36);
    },

    renderReflectionDiagram(ctx, w, h, textColor, subTextColor, axisColor, ray1Color, imageColor, isDark) {
      ctx.font = 'bold 15px Outfit, sans-serif';
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.fillText('Laws of Reflection of Light', w / 2, 28);

      const cy = Math.round(h * 0.65);
      const cx = Math.round(w / 2);

      // Plane Mirror surface
      ctx.beginPath();
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 4;
      ctx.moveTo(40, cy);
      ctx.lineTo(w - 40, cy);
      ctx.stroke();

      // Silvered Hatching below mirror
      ctx.strokeStyle = '#9ca3af';
      ctx.lineWidth = 1.2;
      for (let x = 40; x <= w - 40; x += 12) {
        ctx.beginPath();
        ctx.moveTo(x, cy);
        ctx.lineTo(x - 8, cy + 10);
        ctx.stroke();
      }

      // Normal Line (Dashed)
      ctx.beginPath();
      ctx.strokeStyle = textColor;
      ctx.lineWidth = 1.8;
      ctx.setLineDash([5, 5]);
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx, cy - 130);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = 'bold 12px Outfit, sans-serif';
      ctx.fillText('Normal (N)', cx, cy - 138);

      // Incident Ray
      const rayLen = 120;
      const angle = 0.65; // ~37 degrees
      const ix = cx - Math.sin(angle) * rayLen;
      const iy = cy - Math.cos(angle) * rayLen;

      ctx.beginPath();
      ctx.strokeStyle = ray1Color;
      ctx.lineWidth = 2.5;
      ctx.moveTo(ix, iy);
      ctx.lineTo(cx, cy);
      ctx.stroke();

      // Reflected Ray
      const rx = cx + Math.sin(angle) * rayLen;
      const ry = cy - Math.cos(angle) * rayLen;
      ctx.beginPath();
      ctx.strokeStyle = imageColor;
      ctx.lineWidth = 2.5;
      ctx.moveTo(cx, cy);
      ctx.lineTo(rx, ry);
      ctx.stroke();

      // Labels
      ctx.font = 'bold 12px Outfit, sans-serif';
      ctx.fillStyle = ray1Color;
      ctx.fillText('Incident Ray', ix - 10, iy - 6);
      ctx.fillStyle = imageColor;
      ctx.fillText('Reflected Ray', rx + 10, ry - 6);

      // Angles i and r arcs
      ctx.beginPath();
      ctx.strokeStyle = ray1Color;
      ctx.lineWidth = 1.5;
      ctx.arc(cx, cy, 35, -Math.PI / 2 - angle, -Math.PI / 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.strokeStyle = imageColor;
      ctx.lineWidth = 1.5;
      ctx.arc(cx, cy, 35, -Math.PI / 2, -Math.PI / 2 + angle);
      ctx.stroke();

      ctx.font = 'bold 12px Outfit, sans-serif';
      ctx.fillStyle = ray1Color;
      ctx.fillText('∠i', cx - 18, cy - 42);
      ctx.fillStyle = imageColor;
      ctx.fillText('∠r', cx + 18, cy - 42);

      // Bottom Law Summary
      const boxY = h - 60;
      ctx.fillStyle = isDark ? 'rgba(30, 41, 59, 0.85)' : 'rgba(243, 244, 246, 0.95)';
      ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.08)';
      ctx.lineWidth = 1;
      ctx.roundRect ? ctx.roundRect(14, boxY, w - 28, 50, 10) : ctx.rect(14, boxY, w - 28, 50);
      ctx.fill();
      ctx.stroke();

      ctx.font = 'bold 11px Outfit, sans-serif';
      ctx.fillStyle = '#059669';
      ctx.textAlign = 'left';
      ctx.fillText('LAWS OF REFLECTION:  ∠i = ∠r (Angle of Incidence = Angle of Reflection)', 24, boxY + 20);
      ctx.font = '500 10.5px Outfit, sans-serif';
      ctx.fillStyle = subTextColor;
      ctx.fillText('The incident ray, reflected ray, and normal to the surface at the point of incidence all lie in the same plane.', 24, boxY + 38);
    },

    renderConvexLensDiagram(ctx, w, h, textColor, subTextColor, axisColor, mirrorColor, ray1Color, ray2Color, objectColor, imageColor, virtualRayColor, isDark) {
      ctx.font = 'bold 15px Outfit, sans-serif';
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.fillText('Convex Lens — Ray Diagram (Real & Inverted Image)', w / 2, 26);

      const cy = Math.round(h * 0.50);
      const cx = Math.round(w / 2);
      const scale = Math.min(w / 520, h / 450);

      // Principal Axis
      ctx.beginPath();
      ctx.strokeStyle = axisColor;
      ctx.lineWidth = 1.5;
      ctx.moveTo(20, cy);
      ctx.lineTo(w - 20, cy);
      ctx.stroke();

      // Convex Lens (Oval)
      ctx.beginPath();
      ctx.strokeStyle = '#3b82f6';
      ctx.fillStyle = isDark ? 'rgba(59, 130, 246, 0.2)' : 'rgba(59, 130, 246, 0.15)';
      ctx.lineWidth = 2.5;
      ctx.ellipse(cx, cy, 14 * scale, 85 * scale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Points: O, F1, 2F1, F2, 2F2
      const fDist = 70 * scale;
      const drawPt = (x, lbl) => {
        ctx.beginPath();
        ctx.fillStyle = textColor;
        ctx.arc(x, cy, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = 'bold 11px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(lbl, x, cy + 16);
      };
      drawPt(cx, 'O');
      drawPt(cx - fDist, 'F1');
      drawPt(cx - 2 * fDist, '2F1');
      drawPt(cx + fDist, 'F2');
      drawPt(cx + 2 * fDist, '2F2');

      // Object AB beyond 2F1
      const ox = cx - 2.3 * fDist;
      const oh = 60 * scale;
      ctx.beginPath();
      ctx.strokeStyle = objectColor;
      ctx.lineWidth = 3;
      ctx.moveTo(ox, cy);
      ctx.lineTo(ox, cy - oh);
      ctx.stroke();
      ctx.fillText('Object (AB)', ox, cy - oh - 6);

      // Ray 1: Parallel -> refracts through F2
      ctx.beginPath();
      ctx.strokeStyle = ray1Color;
      ctx.lineWidth = 2;
      ctx.moveTo(ox, cy - oh);
      ctx.lineTo(cx, cy - oh);
      ctx.lineTo(cx + 2.5 * fDist, cy + (oh * 1.5));
      ctx.stroke();

      // Ray 2: Optical center O
      ctx.beginPath();
      ctx.strokeStyle = ray2Color;
      ctx.lineWidth = 2;
      ctx.moveTo(ox, cy - oh);
      ctx.lineTo(cx + 2.5 * fDist, cy + (oh * 1.5));
      ctx.stroke();

      // Image
      const imgX = cx + 1.6 * fDist;
      const imgH = 42 * scale;
      ctx.beginPath();
      ctx.strokeStyle = imageColor;
      ctx.lineWidth = 2.5;
      ctx.moveTo(imgX, cy);
      ctx.lineTo(imgX, cy + imgH);
      ctx.stroke();
      ctx.fillStyle = imageColor;
      ctx.fillText("Real Image (A'B')", imgX, cy + imgH + 16);
    },

    renderRefractionDiagram(ctx, w, h, textColor, subTextColor, axisColor, ray1Color, imageColor, isDark) {
      ctx.font = 'bold 15px Outfit, sans-serif';
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.fillText('Refraction Through a Glass Slab', w / 2, 28);

      const cy = Math.round(h * 0.45);
      const cx = Math.round(w / 2);
      const slabW = Math.min(260, w - 80);
      const slabH = 100;

      // Glass Slab
      ctx.fillStyle = isDark ? 'rgba(56, 189, 248, 0.15)' : 'rgba(56, 189, 248, 0.12)';
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 2;
      ctx.fillRect(cx - slabW / 2, cy - slabH / 2, slabW, slabH);
      ctx.strokeRect(cx - slabW / 2, cy - slabH / 2, slabW, slabH);

      ctx.font = 'bold 12px Outfit, sans-serif';
      ctx.fillStyle = subTextColor;
      ctx.fillText('Glass (Denser Medium)', cx, cy);

      // Normal 1
      const n1x = cx - 40;
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = textColor;
      ctx.beginPath();
      ctx.moveTo(n1x, cy - slabH / 2 - 35);
      ctx.lineTo(n1x, cy - slabH / 2 + 35);
      ctx.stroke();
      ctx.setLineDash([]);

      // Normal 2
      const n2x = cx + 15;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(n2x, cy + slabH / 2 - 35);
      ctx.lineTo(n2x, cy + slabH / 2 + 35);
      ctx.stroke();
      ctx.setLineDash([]);

      // Rays
      ctx.strokeStyle = ray1Color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(n1x - 60, cy - slabH / 2 - 50); // Incident
      ctx.lineTo(n1x, cy - slabH / 2);
      ctx.lineTo(n2x, cy + slabH / 2); // Refracted
      ctx.lineTo(n2x + 60, cy + slabH / 2 + 50); // Emergent
      ctx.stroke();

      ctx.font = 'bold 11px Outfit, sans-serif';
      ctx.fillStyle = ray1Color;
      ctx.fillText('Incident Ray', n1x - 45, cy - slabH / 2 - 55);
      ctx.fillText('Emergent Ray', n2x + 55, cy + slabH / 2 + 55);
    },

    renderTriangleDiagram(ctx, w, h, textColor, subTextColor, objectColor, imageColor, isDark) {
      ctx.font = 'bold 15px Outfit, sans-serif';
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.fillText('Right-Angled Triangle & Pythagoras Theorem', w / 2, 28);

      const bx = Math.round(w * 0.28);
      const by = Math.round(h * 0.72);
      const tw = Math.min(220, w * 0.45);
      const th = Math.min(180, h * 0.45);

      ctx.beginPath();
      ctx.strokeStyle = objectColor;
      ctx.lineWidth = 3;
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + tw, by);
      ctx.lineTo(bx, by - th);
      ctx.closePath();
      ctx.stroke();

      // 90 deg marker
      ctx.strokeStyle = textColor;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(bx, by - 16, 16, 16);

      ctx.font = 'bold 13px Outfit, sans-serif';
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.fillText('Base (b)', bx + tw / 2, by + 22);
      ctx.textAlign = 'right';
      ctx.fillText('Height (a)', bx - 10, by - th / 2);
      ctx.textAlign = 'left';
      ctx.fillStyle = imageColor;
      ctx.fillText('Hypotenuse c = √(a² + b²)', bx + tw / 2 + 10, by - th / 2);

      const boxY = h - 60;
      ctx.fillStyle = isDark ? 'rgba(30, 41, 59, 0.85)' : 'rgba(243, 244, 246, 0.95)';
      ctx.roundRect ? ctx.roundRect(14, boxY, w - 28, 50, 10) : ctx.rect(14, boxY, w - 28, 50);
      ctx.fill();
      ctx.fillStyle = '#059669';
      ctx.fillText('Pythagoras Theorem: a² + b² = c²   |   sin θ = a/c, cos θ = b/c, tan θ = a/b', 24, boxY + 30);
    },

    renderCircleDiagram(ctx, w, h, textColor, subTextColor, objectColor, imageColor, isDark) {
      ctx.font = 'bold 15px Outfit, sans-serif';
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.fillText('Circle Geometry & Tangent Theorem', w / 2, 28);

      const cx = Math.round(w / 2);
      const cy = Math.round(h * 0.48);
      const r = Math.min(90, h * 0.25);

      ctx.beginPath();
      ctx.strokeStyle = objectColor;
      ctx.lineWidth = 3;
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();

      // Center
      ctx.beginPath();
      ctx.fillStyle = textColor;
      ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = 'bold 12px Outfit, sans-serif';
      ctx.fillText('O (Center)', cx, cy - 8);

      // Tangent line at bottom
      const ty = cy + r;
      ctx.beginPath();
      ctx.strokeStyle = imageColor;
      ctx.lineWidth = 2.5;
      ctx.moveTo(cx - 130, ty);
      ctx.lineTo(cx + 130, ty);
      ctx.stroke();

      // Radius to tangent
      ctx.beginPath();
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2;
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx, ty);
      ctx.stroke();

      // 90 deg marker
      ctx.strokeRect(cx, ty - 12, 12, 12);
      ctx.fillText('Radius r', cx + 18, cy + r / 2);
      ctx.fillStyle = imageColor;
      ctx.fillText('Tangent Line (Perpendicular to Radius at Contact Point)', cx, ty + 20);
    },

    renderGenericBoard(ctx, w, h, title, textColor, subTextColor, axisColor, isDark) {
      ctx.font = 'bold 16px Outfit, sans-serif';
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.fillText(title, w / 2, 32);

      // Grid guidelines
      ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.05)';
      ctx.lineWidth = 1;
      for (let x = 20; x < w; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, 50);
        ctx.lineTo(x, h - 50);
        ctx.stroke();
      }
      for (let y = 50; y < h - 40; y += 30) {
        ctx.beginPath();
        ctx.moveTo(20, y);
        ctx.lineTo(w - 20, y);
        ctx.stroke();
      }

      ctx.font = '13px Outfit, sans-serif';
      ctx.fillStyle = subTextColor;
      ctx.fillText('Interactive Scratchpad Board — Use colored pens to annotate or solve problems', w / 2, h / 2);
      window.dispatchEvent(new CustomEvent('tutor-drawing-finished'));
    }
  };
}
