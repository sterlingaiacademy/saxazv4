<!-- Enhanced Tools Box Partial (Math & Science Symbols, Formulas, Elements) -->
<div x-data="mathTools()">
  
  <!-- Floating Tools Box Panel -->
  <div x-show="showSymbols" x-cloak
       @mousedown="bringToFront()"
       @touchstart.passive="bringToFront()"
       x-transition:enter="transition duration-200 ease-out"
       x-transition:enter-start="opacity-0 scale-95 -translate-y-2"
       x-transition:enter-end="opacity-100 scale-100 translate-y-0"
       x-transition:leave="transition duration-150 ease-in"
       x-transition:leave-start="opacity-100 scale-100 translate-y-0"
       x-transition:leave-end="opacity-0 scale-95 -translate-y-2"
       class="math-tools-panel fixed bg-[#ffffff] rounded-3xl border-2 border-[#231f20] overflow-hidden pointer-events-auto flex flex-col text-[#231f20] select-none"
       :style="{ position: 'fixed', zIndex: panelZ, display: showSymbols ? 'flex' : 'none', top: symPos.y + 'px', left: symPos.x + 'px', width: boxSize.width + 'px', maxHeight: boxSize.height + 'px', boxShadow: '0 22px 50px rgba(35,31,32,0.22)' }">
      
    <!-- Header / Drag Handle -->
    <div @mousedown="startDrag($event)" class="math-tools-header bg-[#f7b317] px-4 py-3 flex justify-between items-center cursor-move select-none border-b-2 border-[#231f20]">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-[#231f20] flex items-center justify-center text-[#f7b317]">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a1 1 0 01-1-1V9a1 1 0 011-1h1a2 2 0 100-4H4a1 1 0 01-1-1V4a1 1 0 011-1h3a1 1 0 011 1v1z" />
          </svg>
        </div>
        <div>
          <h3 class="font-extrabold text-sm text-[#231f20] leading-tight flex items-center gap-1.5">
            Math &amp; Science Symbols
          </h3>
          <p class="text-[11px] text-[#231f20]/75 font-semibold leading-none mt-0.5">Click or drag to insert into answer</p>
        </div>
      </div>
      
      <div class="flex items-center gap-1.5" @mousedown.stop @touchstart.stop>
        <!-- Close Button -->
        <button type="button"
                @click="showSymbols = false; document.body.classList.remove('math-tools-open')"
                class="math-tools-close-btn w-7 h-7 rounded-full bg-[#231f20] text-[#ffffff] hover:text-[#f7b317] transition-colors flex items-center justify-center cursor-pointer"
                title="Close Symbols">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
    </div>
    
    <!-- Insertion Toast Notification -->
    <div x-show="toastMessage" x-cloak
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 -translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 -translate-y-2"
         class="bg-[#231f20] border-b border-[#231f20] text-[#f7b317] px-4 py-1.5 text-xs font-bold flex items-center justify-between">
      <span class="flex items-center gap-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-[#f7b317]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" /></svg>
        <span x-text="toastMessage"></span>
      </span>
      <span class="text-[10px] text-[#ffffff] font-mono font-semibold">Inserted</span>
    </div>
    
    <!-- Category Tabs -->
    <div class="math-tools-tabs flex bg-[#ffffff] p-1.5 gap-1 border-b border-[#231f20]/15 overflow-x-auto no-scrollbar">
      <button type="button" @click="symbolCategory = 'math'" 
              :class="symbolCategory === 'math' ? 'bg-[#231f20] text-[#f7b317] border border-[#231f20] font-extrabold' : 'bg-[#ffffff] text-[#231f20] border border-[#231f20]/20 hover:bg-[#f7b317] hover:text-[#231f20] hover:border-[#231f20] font-bold'" 
              class="flex-1 shrink-0 whitespace-nowrap py-1.5 px-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all duration-150 cursor-pointer">
        Math
      </button>
      <button type="button" @click="symbolCategory = 'physics'" 
              :class="symbolCategory === 'physics' ? 'bg-[#231f20] text-[#f7b317] border border-[#231f20] font-extrabold' : 'bg-[#ffffff] text-[#231f20] border border-[#231f20]/20 hover:bg-[#f7b317] hover:text-[#231f20] hover:border-[#231f20] font-bold'" 
              class="flex-1 shrink-0 whitespace-nowrap py-1.5 px-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all duration-150 cursor-pointer">
        Physics
      </button>
      <button type="button" @click="symbolCategory = 'chem'" 
              :class="symbolCategory === 'chem' ? 'bg-[#231f20] text-[#f7b317] border border-[#231f20] font-extrabold' : 'bg-[#ffffff] text-[#231f20] border border-[#231f20]/20 hover:bg-[#f7b317] hover:text-[#231f20] hover:border-[#231f20] font-bold'" 
              class="flex-1 shrink-0 whitespace-nowrap py-1.5 px-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all duration-150 cursor-pointer">
        Chem
      </button>
      <button type="button" @click="symbolCategory = 'templates'" 
              :class="symbolCategory === 'templates' ? 'bg-[#231f20] text-[#f7b317] border border-[#231f20] font-extrabold' : 'bg-[#ffffff] text-[#231f20] border border-[#231f20]/20 hover:bg-[#f7b317] hover:text-[#231f20] hover:border-[#231f20] font-bold'" 
              class="flex-1 shrink-0 whitespace-nowrap py-1.5 px-2 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all duration-150 cursor-pointer">
        Formulas
      </button>
    </div>
    
    <!-- Search Bar -->
    <div class="math-tools-search-box px-3 pt-2.5 pb-2 bg-[#ffffff] border-b border-[#231f20]/15">
      <div class="relative">
        <input type="text" 
               x-model="searchQuery" 
               :placeholder="symbolCategory === 'chem' ? 'Search element or compound...' : 'Search symbol or term...'" 
               class="math-tools-search-input w-full pl-8 pr-7 py-1.5 text-xs font-semibold rounded-xl bg-[#ffffff] text-[#231f20] placeholder-[#231f20]/45 border border-[#231f20]/25 focus:border-[#231f20] focus:outline-none focus:ring-2 focus:ring-[#f7b317] transition-all" 
               @keydown.stop>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 text-[#231f20]/55" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <button type="button" x-show="searchQuery.length > 0" @click="searchQuery = ''" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[#231f20]/60 hover:text-[#231f20]">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" /></svg>
        </button>
      </div>

      <!-- Chemistry Search Quick Results -->
      <div x-show="symbolCategory === 'chem' && searchQuery.length > 0" class="math-tools-chem-search max-h-36 overflow-y-auto mt-1.5 rounded-xl bg-[#ffffff] p-1 border border-[#231f20]/20">
        <template x-for="item in getFilteredChemSearch()">
          <button type="button"
                  draggable="true" 
                  @dragstart="$event.dataTransfer.setData('text/plain', item.formula); $event.dataTransfer.setData('application/x-saxaz-mathtool', '1')" 
                  @click="insertSymbol(item.formula); searchQuery = ''" 
                  class="w-full text-left px-2.5 py-1.5 text-xs bg-[#ffffff] hover:bg-[#f7b317] hover:text-[#231f20] hover:border-[#231f20] text-[#231f20] border border-transparent rounded-lg flex justify-between items-center transition-colors cursor-move group mb-0.5">
            <span x-text="item.name" class="capitalize font-bold"></span>
            <span x-text="item.formula" class="font-mono font-bold tracking-wider px-1.5 py-0.5 rounded bg-[#231f20] text-[#f7b317] border border-[#231f20]"></span>
          </button>
        </template>
        <div x-show="getFilteredChemSearch().length === 0" class="text-xs text-center py-2 text-[#231f20]/55 font-semibold">No matching element found</div>
      </div>
    </div>
    
    <!-- Symbol Grid Container -->
    <div class="math-tools-grid-box p-3 overflow-y-auto bg-[#ffffff] flex-1" :style="`max-height: ${boxSize.height - 170}px;`">
      
      <!-- Standard Symbols View (Math, Physics, Chem) -->
      <div x-show="symbolCategory !== 'templates'" class="grid grid-cols-[repeat(auto-fill,minmax(40px,1fr))] gap-1.5">
        <template x-for="sym in getFilteredSymbols()">
          <button type="button"
                  draggable="true" 
                  @dragstart="$event.dataTransfer.setData('text/plain', sym.val); $event.dataTransfer.setData('application/x-saxaz-mathtool', '1')" 
                  @click="insertSymbol(sym.val)" 
                  class="math-tools-btn h-9 bg-[#ffffff] text-[#231f20] hover:bg-[#f7b317] hover:text-[#231f20] hover:border-[#231f20] font-mono font-bold text-sm rounded-xl border border-[#231f20]/25 transition-all duration-150 flex items-center justify-center cursor-move group relative select-none" 
                  :title="sym.label || 'Click or Drag to insert'">
            <span x-text="sym.val" :class="{'text-xs font-bold': sym.val.length > 2}" class="pointer-events-none"></span>
          </button>
        </template>
      </div>

      <!-- Formulas & Templates View -->
      <div x-show="symbolCategory === 'templates'" x-cloak class="grid grid-cols-1 gap-2">
        <template x-for="tmpl in getFilteredTemplates()">
          <button type="button"
                  @click="insertSymbol(tmpl.code)" 
                  class="math-tools-formula-btn w-full text-left p-2.5 rounded-xl bg-[#ffffff] text-[#231f20] hover:bg-[#f7b317] hover:text-[#231f20] hover:border-[#231f20] border border-[#231f20]/25 transition-all flex items-center justify-between group cursor-pointer">
            <div>
              <div class="text-xs font-extrabold text-[#231f20]" x-text="tmpl.name"></div>
              <div class="text-[11px] font-mono text-[#231f20]/80 mt-0.5 font-semibold" x-text="tmpl.code"></div>
            </div>
            <span class="px-2.5 py-0.5 text-[10px] font-extrabold text-[#f7b317] bg-[#231f20] rounded-lg">Insert</span>
          </button>
        </template>
      </div>
    </div>

    <!-- Footer Status / Guide + Resize Handle -->
    <div class="math-tools-footer px-3 py-1.5 bg-[#ffffff] border-t border-[#231f20]/15 flex justify-between items-center text-[10px] text-[#231f20]/75 font-semibold">
      <span class="truncate flex items-center gap-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-[#231f20] inline shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        Focus answer box &amp; click to insert
      </span>
      <div class="flex items-center gap-1.5 flex-shrink-0">
        <span class="math-tools-badge font-mono font-bold text-[#231f20] bg-[#f7b317] px-1.5 py-0.5 rounded border border-[#231f20] text-[9px]" x-text="`${getFilteredSymbols().length} symbols`"></span>
        <!-- Drag Resize Handle Icon -->
        <div @mousedown.stop.prevent="startResize($event)" 
             class="math-tools-resize-handle hidden sm:flex w-5 h-5 rounded bg-[#ffffff] hover:bg-[#f7b317] hover:text-[#231f20] hover:border-[#231f20] border border-[#231f20]/30 text-[#231f20] items-center justify-center cursor-se-resize transition-all select-none"
             title="Click & Drag to resize">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 transform rotate-90" viewBox="0 0 20 20" fill="currentColor">
            <path d="M6 4a1 1 0 011 1v10a1 1 0 11-2 0V5a1 1 0 011-1zm6 0a1 1 0 011 1v10a1 1 0 11-2 0V5a1 1 0 011-1z" />
          </svg>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Hidden Programmatic Trigger (Permanent floating right-edge dock is hidden to prevent distraction) -->
  <div id="math-tools-dock-wrap" style="display: none !important;" aria-hidden="true">
    <button id="math-tools-dock-btn" type="button" @click="toggleSymbols" tabindex="-1">Math &amp; Symbols</button>
  </div>
</div>

<style>
#math-tools-dock-wrap {
  display: none !important;
}
@media (max-width: 640px) {
  .math-tools-panel {
    position: fixed !important;
    top: auto !important;
    bottom: 8px !important;
    left: 8px !important;
    right: 8px !important;
    width: auto !important;
    max-width: calc(100vw - 16px) !important;
    height: 50dvh !important;
    max-height: 390px !important;
    margin: 0 auto !important;
    border-radius: 1.5rem !important;
  }
  .math-tools-grid-box {
    max-height: calc(50dvh - 165px) !important;
  }
}
</style>

<script>
function mathTools() {
  return {
    showSymbols: false,
    panelZ: 1210,
    symbolCategory: 'math',
    symPos: {x: 0, y: 0},
    boxSize: {width: 390, height: 430},
    dragging: false,
    resizing: false,
    dragOffset: {x: 0, y: 0},
    resizeStart: {x: 0, y: 0, width: 0, height: 0},
    searchQuery: '',
    toastMessage: '',
    toastTimeout: null,

    bringToFront() {
      window.__saxazFloatingToolZCounter = Math.max(1210, (window.__saxazFloatingToolZCounter || 1210) + 1);
      this.panelZ = window.__saxazFloatingToolZCounter;
    },

    startResize(e) {
      this.bringToFront();
      this.resizing = true;
      this.resizeStart = {
        x: e.clientX,
        y: e.clientY,
        width: this.boxSize.width,
        height: this.boxSize.height
      };
    },
    
    symbolLists: {
      math: [
        {val: 'π', label: 'Pi'}, {val: 'e', label: 'Euler number'}, {val: 'θ', label: 'Theta'}, {val: 'α', label: 'Alpha'}, 
        {val: 'β', label: 'Beta'}, {val: 'γ', label: 'Gamma'}, {val: 'Δ', label: 'Delta'}, {val: 'Σ', label: 'Sigma'}, 
        {val: 'Ω', label: 'Omega'}, {val: 'μ', label: 'Mu'}, {val: 'λ', label: 'Lambda'}, {val: '√', label: 'Square Root'}, 
        {val: '∛', label: 'Cube Root'}, {val: '±', label: 'Plus-minus'}, {val: '×', label: 'Multiply'}, {val: '÷', label: 'Divide'}, 
        {val: '≈', label: 'Approximately'}, {val: '≠', label: 'Not Equal'}, {val: '≤', label: 'Less than/Equal'}, {val: '≥', label: 'Greater than/Equal'}, 
        {val: '∞', label: 'Infinity'}, {val: '°', label: 'Degree'}, {val: '²', label: 'Square'}, {val: '³', label: 'Cube'}, 
        {val: '½', label: 'Half'}, {val: '¼', label: 'Quarter'}, {val: 'sin', label: 'Sine'}, {val: 'cos', label: 'Cosine'}, 
        {val: 'tan', label: 'Tangent'}, {val: 'log', label: 'Logarithm'}, {val: 'ln', label: 'Natural Log'}, {val: '!', label: 'Factorial'}, 
        {val: '∫', label: 'Integral'}, {val: '∬', label: 'Double Integral'}, {val: '∑', label: 'Summation'}, {val: '∏', label: 'Product'},
        {val: 'lim', label: 'Limit'}, {val: 'd/dx', label: 'Derivative'}, {val: '∈', label: 'Element of'}, {val: '∉', label: 'Not element of'},
        {val: '⊂', label: 'Subset'}, {val: '⊆', label: 'Subset equal'}, {val: '∪', label: 'Union'}, {val: '∩', label: 'Intersection'},
        {val: '∀', label: 'For all'}, {val: '∃', label: 'Exists'}, {val: '∴', label: 'Therefore'}, {val: '∵', label: 'Because'}
      ],
      physics: [
        {val: 'v', label: 'Velocity'}, {val: 'a', label: 'Acceleration'}, {val: 't', label: 'Time'}, {val: 'F', label: 'Force'}, 
        {val: 'm', label: 'Mass'}, {val: 'E', label: 'Energy'}, {val: 'P', label: 'Power'}, {val: 'W', label: 'Work'}, 
        {val: 'p', label: 'Momentum'}, {val: 'τ', label: 'Torque'}, {val: 'ω', label: 'Angular Speed'}, {val: 'T', label: 'Period / Temp'}, 
        {val: 'f', label: 'Frequency'}, {val: 'c', label: 'Speed of Light'}, {val: 'h', label: 'Planck Constant'}, {val: 'G', label: 'Gravitational Const'}, 
        {val: 'g', label: 'Gravity'}, {val: 'ρ', label: 'Density'}, {val: 'I', label: 'Current'}, {val: 'R', label: 'Resistance'}, 
        {val: 'C', label: 'Capacitance'}, {val: 'L', label: 'Inductance'}, {val: 'B', label: 'Magnetic Field'}, {val: 'λ', label: 'Wavelength'}, 
        {val: 'ε', label: 'Permittivity'}, {val: 'μ₀', label: 'Permeability'}, {val: 'ε₀', label: 'Vacuum Permittivity'}, {val: 'Φ', label: 'Flux'}, 
        {val: 'Ψ', label: 'Wave function'}, {val: '∇', label: 'Nabla/Gradient'}, {val: '∂', label: 'Partial diff'}, {val: '∝', label: 'Proportional'}, 
        {val: 'm/s', label: 'Meters per second'}, {val: 'm/s²', label: 'Meters per second squared'}, {val: 'N', label: 'Newton'}, {val: 'J', label: 'Joule'},
        {val: 'W', label: 'Watt'}, {val: 'Pa', label: 'Pascal'}, {val: 'Hz', label: 'Hertz'}, {val: 'Ω', label: 'Ohm'},
        {val: 'V', label: 'Volt'}, {val: 'A', label: 'Ampere'}, {val: 'kg', label: 'Kilogram'}, {val: 'mol', label: 'Mole'}
      ],
      chem: [
        {val: '→', label: 'Reaction Arrow'}, {val: '⇌', label: 'Equilibrium Arrow'}, {val: 'Δ', label: 'Heat'}, {val: '₀', label: 'Subscript 0'}, 
        {val: '₁', label: 'Subscript 1'}, {val: '₂', label: 'Subscript 2'}, {val: '₃', label: 'Subscript 3'}, {val: '₄', label: 'Subscript 4'}, 
        {val: '₅', label: 'Subscript 5'}, {val: '₆', label: 'Subscript 6'}, {val: '₇', label: 'Subscript 7'}, {val: '₈', label: 'Subscript 8'}, 
        {val: '₉', label: 'Subscript 9'}, {val: '⁺', label: 'Positive Charge'}, {val: '⁻', label: 'Negative Charge'}, {val: '²⁺', label: '2+ Charge'},
        {val: '³⁺', label: '3+ Charge'}, {val: '²⁻', label: '2- Charge'}, {val: '°C', label: 'Celsius'}, {val: '(s)', label: 'Solid'}, 
        {val: '(l)', label: 'Liquid'}, {val: '(g)', label: 'Gas'}, {val: '(aq)', label: 'Aqueous'}, {val: 'e⁻', label: 'Electron'}, 
        {val: 'H⁺', label: 'Hydrogen Ion'}, {val: 'OH⁻', label: 'Hydroxide Ion'}, {val: 'pH', label: 'pH'}, {val: 'K', label: 'Potassium'}, 
        {val: 'Na', label: 'Sodium'}, {val: 'Cl', label: 'Chlorine'}, {val: 'O', label: 'Oxygen'}, {val: 'H', label: 'Hydrogen'}, 
        {val: 'C', label: 'Carbon'}, {val: 'N', label: 'Nitrogen'}, {val: 'Fe', label: 'Iron'}, {val: 'Cu', label: 'Copper'}, 
        {val: 'S', label: 'Sulfur'}, {val: 'P', label: 'Phosphorus'}, {val: 'Pb', label: 'Lead'}, {val: 'Zn', label: 'Zinc'}
      ]
    },
    
    formulaTemplates: [
      {name: 'Fraction (a/b)', code: '(a / b)'},
      {name: 'Quadratic Equation', code: 'ax² + bx + c = 0'},
      {name: 'Pythagorean Theorem', code: 'a² + b² = c²'},
      {name: 'Circle Area', code: 'A = πr²'},
      {name: 'Trig Identity', code: 'sin²(θ) + cos²(θ) = 1'},
      {name: 'Einstein Mass-Energy', code: 'E = mc²'},
      {name: 'Newton Second Law', code: 'F = ma'},
      {name: 'Ohm\'s Law', code: 'V = I × R'},
      {name: 'Kinematic Equation', code: 'v = u + at'},
      {name: 'Water Molecule', code: 'H₂O'},
      {name: 'Carbon Dioxide', code: 'CO₂'},
      {name: 'Sulfuric Acid', code: 'H₂SO₄'},
      {name: 'Lead Nitrate Thermal Decomposition', code: '2Pb(NO₃)₂ → 2PbO + 4NO₂ + O₂'}
    ],

    periodicTable: {
      'hydrogen': 'H₂', 'helium': 'He', 'lithium': 'Li', 'beryllium': 'Be', 'boron': 'B', 'carbon': 'C', 'nitrogen': 'N₂', 'oxygen': 'O₂', 'fluorine': 'F₂', 'neon': 'Ne',
      'sodium': 'Na', 'magnesium': 'Mg', 'aluminum': 'Al', 'silicon': 'Si', 'phosphorus': 'P₄', 'sulfur': 'S₈', 'chlorine': 'Cl₂', 'argon': 'Ar',
      'potassium': 'K', 'calcium': 'Ca', 'scandium': 'Sc', 'titanium': 'Ti', 'vanadium': 'V', 'chromium': 'Cr', 'manganese': 'Mn', 'iron': 'Fe', 'cobalt': 'Co', 'nickel': 'Ni', 'copper': 'Cu', 'zinc': 'Zn',
      'silver': 'Ag', 'gold': 'Au', 'platinum': 'Pt', 'mercury': 'Hg', 'lead': 'Pb', 'tin': 'Sn', 'bromine': 'Br₂', 'iodine': 'I₂',
      'water': 'H₂O', 'carbon dioxide': 'CO₂', 'ammonia': 'NH₃', 'methane': 'CH₄', 'sulfuric acid': 'H₂SO₄', 'hydrochloric acid': 'HCl', 'nitric acid': 'HNO₃', 'sodium hydroxide': 'NaOH',
      'lead nitrate': 'Pb(NO₃)₂', 'lead oxide': 'PbO', 'nitrogen dioxide': 'NO₂', 'ferrous sulphate': 'FeSO₄', 'ferric oxide': 'Fe₂O₃', 'sulphur dioxide': 'SO₂', 'sulphur trioxide': 'SO₃',
      'glucose': 'C₆H₁₂O₆', 'ethanol': 'C₂H₅OH', 'sodium chloride': 'NaCl', 'calcium carbonate': 'CaCO₃', 'ozone': 'O₃'
    },
    
    getFilteredSymbols() {
      let list = this.symbolLists[this.symbolCategory] || [];
      if (!this.searchQuery) return list;
      let q = this.searchQuery.toLowerCase();
      return list.filter(item => item.val.toLowerCase().includes(q) || (item.label && item.label.toLowerCase().includes(q)));
    },

    getFilteredTemplates() {
      if (!this.searchQuery) return this.formulaTemplates;
      let q = this.searchQuery.toLowerCase();
      return this.formulaTemplates.filter(t => t.name.toLowerCase().includes(q) || t.code.toLowerCase().includes(q));
    },
    
    getFilteredChemSearch() {
      if (!this.searchQuery) return [];
      let q = this.searchQuery.toLowerCase();
      let results = [];
      for (let key in this.periodicTable) {
        if (key.includes(q) || this.periodicTable[key].toLowerCase().includes(q)) {
          results.push({name: key, formula: this.periodicTable[key]});
        }
      }
      return results.slice(0, 15);
    },
    
    isValidTextInput(el) {
      if (!el || el.disabled || el.readOnly) return false;
      const xModel = el.getAttribute('x-model') || '';
      if (['searchQuery', 'paletteSearch', 'quickDrawInput'].includes(xModel)) return false;
      if (el.tagName === 'TEXTAREA') return true;
      if (el.tagName === 'INPUT') {
        const type = (el.getAttribute('type') || 'text').toLowerCase();
        return ['text', 'search', 'number'].includes(type);
      }
      return false;
    },

    init() {
      this.activeElement = null;
      document.addEventListener('focusin', (e) => {
        if (this.isValidTextInput(e.target)) {
          this.activeElement = e.target;
        }
      });
      
      document.addEventListener('mousemove', (e) => {
        if (this.resizing) {
          let deltaX = e.clientX - this.resizeStart.x;
          let deltaY = e.clientY - this.resizeStart.y;
          let newWidth = Math.max(280, Math.min(640, this.resizeStart.width + deltaX));
          let newHeight = Math.max(280, Math.min(720, this.resizeStart.height + deltaY));
          this.boxSize = { width: newWidth, height: newHeight };
          return;
        }

        if (this.dragging) {
          let newX = e.clientX - this.dragOffset.x;
          let newY = e.clientY - this.dragOffset.y;
          newX = Math.max(10, Math.min(newX, window.innerWidth - 200));
          newY = Math.max(10, Math.min(newY, window.innerHeight - 100));
          this.symPos = {x: newX, y: newY};
        }
      });
      
      document.addEventListener('mouseup', () => {
        this.dragging = false;
        this.resizing = false;
      });

      window.addEventListener('toggle-math-tools', () => {
        this.toggleSymbols();
      });
    },
    
    startDrag(e) {
      this.bringToFront();
      this.dragging = true;
      this.dragOffset = {
        x: e.clientX - this.symPos.x,
        y: e.clientY - this.symPos.y
      };
    },

    toggleSymbols() {
      this.showSymbols = !this.showSymbols;
      document.body.classList.toggle('math-tools-open', this.showSymbols);
      if (this.showSymbols) {
        this.bringToFront();
        const panelWidth = Math.min(this.boxSize.width, window.innerWidth - 32);
        const startX = Math.max(16, Math.round((window.innerWidth - panelWidth) / 2));
        const startY = Math.max(70, Math.round((window.innerHeight - Math.min(this.boxSize.height, window.innerHeight - 80)) / 2));
        this.symPos = { x: startX, y: startY };
      }
    },
    
    showNotification(msg) {
      this.toastMessage = msg;
      if (this.toastTimeout) clearTimeout(this.toastTimeout);
      this.toastTimeout = setTimeout(() => {
        this.toastMessage = '';
      }, 2000);
    },

    insertSymbol(sym) {
      if (!this.isValidTextInput(this.activeElement) || this.activeElement.offsetParent === null) {
        const candidates = Array.from(document.querySelectorAll('textarea, input[type="text"]'));
        this.activeElement = candidates.find(el => this.isValidTextInput(el) && el.offsetParent !== null) || null;
      }
      if (this.activeElement) {
        const start = this.activeElement.selectionStart || 0;
        const end = this.activeElement.selectionEnd || 0;
        const text = this.activeElement.value || '';
        
        this.activeElement.value = text.slice(0, start) + sym + text.slice(end);
        this.activeElement.dispatchEvent(new Event('input', { bubbles: true }));
        
        setTimeout(() => {
          this.activeElement.focus();
          try {
            this.activeElement.selectionStart = this.activeElement.selectionEnd = start + sym.length;
          } catch(e) {}
        }, 10);
        
        this.showNotification(`Inserted "${sym}"`);
      } else {
        navigator.clipboard.writeText(sym);
        this.showNotification(`Copied "${sym}" to clipboard`);
      }
    }
  };
}
</script>
