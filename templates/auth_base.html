<!DOCTYPE html>
<html lang="en" class="scrollbars-visible" data-theme="light" style="font-size: 17.5px;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>{% block title %}SAXAZ{% endblock %}</title>
  <link rel="icon" href="/static/images/saxaz_web/favicon-saxaz-x-v1.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="/static/images/saxaz_web/apple-touch-icon-saxaz-x-v1.png">

  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400..700&family=Baloo+Chettan+2:wght@500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">

  <!-- Compiled Tailwind + SAXAZ Stylesheets -->
  <link rel="stylesheet" href="/static/css/app.css?v=250">
  <link rel="stylesheet" href="/static/css/v2-studio.css?v=540">
  <link rel="stylesheet" href="/static/css/saxaz-ext.css?v=540">
  <link rel="stylesheet" href="/static/css/saxaz-match.css?v=4">
  <script src="/static/js/fun.js?v=540" defer></script>

  <style>
    [x-cloak] { display: none !important; }
    body.sx-auth-body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      color: #231f20;
    }
    .sx-auth-main-wrap {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
    }
    .sx-auth-main-wrap > #stitch-tailwind-root {
      flex: 1 0 auto;
      min-height: 0;
    }
  </style>

  <script>
    window.getSaxazTheme = () => 'light';
    window.applySaxazTheme = () => {
      localStorage.setItem('themeMode', 'light');
      document.documentElement.setAttribute('data-theme', 'light');
      document.documentElement.classList.remove('dark');
      document.documentElement.style.colorScheme = 'light';
      window.dispatchEvent(new CustomEvent('saxaz-theme-change', { detail: { theme: 'light' } }));
      return 'light';
    };
    window.applySaxazTheme();

    window.getSaxazFontSize = () => {
      const cookieFont = document.cookie.split('; ').find(r => r.startsWith('fontSizeMode='))?.split('=')[1];
      const saved = localStorage.getItem('fontSizeMode') || cookieFont || '1';
      return Math.max(1, Math.min(4, parseInt(saved, 10) || 1));
    };
    window.applySaxazFontSize = (mode) => {
      const m = Math.max(1, Math.min(4, parseInt(mode || 1, 10)));
      const isSmallScreen = window.innerWidth < 640;
      const desktopSizes = { 1: 17.5, 2: 19.0, 3: 20.5, 4: 22.5 };
      const mobileSizes  = { 1: 16.5, 2: 18.0, 3: 19.5, 4: 21.0 };
      const rootSize = isSmallScreen ? mobileSizes[m] : desktopSizes[m];
      document.documentElement.style.setProperty('font-size', `${rootSize}px`, 'important');
      document.documentElement.setAttribute('data-font-size', String(m));
      localStorage.setItem('fontSizeMode', String(m));
      document.cookie = `fontSizeMode=${m};path=/;max-age=31536000`;
      window.dispatchEvent(new CustomEvent('saxaz-fontsize-change', { detail: { mode: m } }));
      return m;
    };
    window.applySaxazFontSize(window.getSaxazFontSize());
    window.addEventListener('resize', () => {
      window.applySaxazFontSize(window.getSaxazFontSize());
    }, { passive: true });
  </script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="scrollbars-visible sx-auth-body">
  <div class="sx-auth-main-wrap">
    {% block content %}{% endblock %}
  </div>
  {% include "footer.html" %}
</body>
</html>
