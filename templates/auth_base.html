<!DOCTYPE html>
{% from "partials/mode_toggle.html" import mode_toggle %}
<html lang="en" class="scrollbars-visible" data-theme="light" style="font-size: 17.5px;">
<head>
  <meta charset="UTF-8">
  <!-- Display mode (light / dark / reading): saved per account, remembered per device -->
  <script>
    (function () {
      var ok = { light: 1, dark: 1, reading: 1 };
      var server = "";
      var local = null;
      try { local = localStorage.getItem('sxMode'); } catch (e) {}
      var mode = ok[server] ? server : (ok[local] ? local : 'light');
      document.documentElement.setAttribute('data-sx-mode', mode);
      try { localStorage.setItem('sxMode', mode); } catch (e) {}
      window.sxGetMode = function () { return document.documentElement.getAttribute('data-sx-mode') || 'light'; };
      window.sxSetMode = function (m) {
        if (!ok[m]) return;
        document.documentElement.setAttribute('data-sx-mode', m);
        try { localStorage.setItem('sxMode', m); } catch (e) {}
        window.dispatchEvent(new CustomEvent('sx-mode-change', { detail: { mode: m } }));
        try {
          var fd = new FormData(); fd.append('theme', m);
          fetch('/set-theme', { method: 'POST', body: fd, credentials: 'same-origin' });
        } catch (e) {}
      };
    })();
  </script>
  <link rel="stylesheet" href="/static/css/saxaz-modes.css?v=5">
  <script defer src="/static/js/sx-modes.js?v=4"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>{% block title %}SAXAZ{% endblock %}</title>
  <link rel="icon" href="/static/images/saxaz_web/favicon-saxaz-x-v1.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="/static/images/saxaz_web/apple-touch-icon-saxaz-x-v1.png">

  <!-- Material Symbols Outlined -->

  <link rel="stylesheet" href="/static/css/saxaz-ext.css?v=546">
  <link rel="stylesheet" href="/static/css/saxaz-match.css?v=21">
  <link rel="stylesheet" href="/static/css/saxaz-cursor.css?v=5">

  <style>
    [x-cloak] { display: none !important; }
    body.sx-auth-body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      color: #231f20;
    }
    .sx-auth-main-wrap {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
    }
    .sx-auth-main-wrap > #stitch-tailwind-root {
      flex: 1 0 auto;
      min-height: 0;
    }
  </style>

  <script>
    window.getSaxazTheme = () => 'light';
    window.applySaxazTheme = () => {
      localStorage.setItem('themeMode', 'light');
      document.documentElement.setAttribute('data-theme', 'light');
      document.documentElement.classList.remove('dark');
      document.documentElement.style.colorScheme = 'light';
      window.dispatchEvent(new CustomEvent('saxaz-theme-change', { detail: { theme: 'light' } }));
      return 'light';
    };
    window.applySaxazTheme();

    window.getSaxazFontSize = () => {
      const cookieFont = document.cookie.split('; ').find(r => r.startsWith('fontSizeMode='))?.split('=')[1];
      const saved = localStorage.getItem('fontSizeMode') || cookieFont || '1';
      return Math.max(1, Math.min(4, parseInt(saved, 10) || 1));
    };
    window.applySaxazFontSize = (mode) => {
      const m = Math.max(1, Math.min(4, parseInt(mode || 1, 10)));
      const isSmallScreen = window.innerWidth < 640;
      const desktopSizes = { 1: 17.5, 2: 19.0, 3: 20.5, 4: 22.5 };
      const mobileSizes  = { 1: 16.5, 2: 18.0, 3: 19.5, 4: 21.0 };
      const rootSize = isSmallScreen ? mobileSizes[m] : desktopSizes[m];
      document.documentElement.style.setProperty('font-size', `${rootSize}px`, 'important');
      document.documentElement.setAttribute('data-font-size', String(m));
      localStorage.setItem('fontSizeMode', String(m));
      document.cookie = `fontSizeMode=${m};path=/;max-age=31536000`;
      window.dispatchEvent(new CustomEvent('saxaz-fontsize-change', { detail: { mode: m } }));
      return m;
    };
    window.applySaxazFontSize(window.getSaxazFontSize());
    let __sxSmallScreen = window.innerWidth < 640;
    window.addEventListener('resize', () => {
      // Only re-apply when switching between phone and desktop sizes (not on every scroll-bar resize on phones)
      const small = window.innerWidth < 640;
      if (small === __sxSmallScreen) return;
      __sxSmallScreen = small;
      window.applySaxazFontSize(window.getSaxazFontSize());
    }, { passive: true });
  </script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js"></script>
</head>
<body class="scrollbars-visible sx-auth-body">
  <div class="sx-auth-main-wrap">
    {% block mode_switch %}<div class="sx-mode-float">{{ mode_toggle('is-on-light') }}</div>{% endblock %}
    {% block content %}{% endblock %}
  </div>
  {% include "footer.html" %}
</body>
</html>
