<!DOCTYPE html>
<html lang="en" data-theme="winter">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>{% block title %}SAXAZ{% endblock %}</title>
  
  <!-- Tailwind CSS + DaisyUI (compiled static, no CDN dependency) -->
  <link rel="stylesheet" href="/static/css/app.css?v=5">
  <style>
    @media (max-width: 640px) {
      input:not([type="radio"]):not([type="checkbox"]), select, textarea {
        font-size: 16px !important;
      }
    }
  </style>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.11"></script>
  
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <!-- Alpine.js theme & font size setup before paint -->
  <script>
    const getCookie = (name) => document.cookie.split('; ').find(row => row.startsWith(name + '='))?.split('=')[1];
    
    // Theme
    const theme = getCookie('theme') || 'dracula';
    document.documentElement.setAttribute('data-theme', theme);
    
    // Font Size
    const fontSizeMode = parseInt(getCookie('fontSizeMode') || '1');
    const rootSize = 14 + (fontSizeMode * 2); // 1: 16px, 2: 18px, 3: 20px, 4: 22px, 5: 24px
    document.documentElement.style.fontSize = `${rootSize}px`;
  </script>
  <style>
    /* Custom Space Background applied only to main content area to keep sidebar solid */
    .space-bg {
      background-color: #0d1117;
      background-image: radial-gradient(circle at center, transparent 0%, #050505 100%), 
               url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='50' cy='50' r='1' fill='%23ffffff' opacity='0.2'/%3E%3Ccircle cx='20' cy='30' r='0.5' fill='%23ffffff' opacity='0.3'/%3E%3Ccircle cx='80' cy='70' r='1.5' fill='%23ffffff' opacity='0.1'/%3E%3C/svg%3E");
      background-size: cover, 150px 150px;
      background-attachment: fixed;
    }
    
    /* Hide sidebar/navbar in exam mode */
    body.exam-mode .global-sidebar, body.exam-mode .global-topbar {
      display: none !important;
    }
    body.exam-mode .main-content-wrapper {
      margin-left: 0 !important;
    }
    html, body {
      overscroll-behavior: none !important;
      overscroll-behavior-y: none !important;
    }
  </style>
</head>
<body class="flex h-screen overflow-hidden font-sans text-base-content antialiased bg-base-200 space-bg"
   x-data="{ 
     theme: getCookie('theme') || 'dracula',
     fontSizeMode: parseInt(getCookie('fontSizeMode') || '1')
   }">

  <!-- Main Content Area (No Sidebar/Topbar) -->
  <div class="flex-1 flex flex-col h-screen overflow-y-auto relative w-full" style="overscroll-behavior: none;">
    <!-- Main Scrollable View -->
    <main class="flex-1 flex min-h-screen w-full">
      <div class="w-full flex">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

  <!-- Global Toast Container for Notifications -->
  <div id="toast-container" class="toast toast-top toast-end z-50 mt-4 pointer-events-none"></div>

</body>
</html>
