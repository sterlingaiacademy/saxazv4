<div data-card-href="/admin/curriculum/chapters/{{ ch.id }}"
     role="link"
     tabindex="0"
     :style="(editingName || editingDesc) ? 'transform:none' : ''"
     class="flex flex-wrap items-center justify-between gap-3 bg-base-100 p-3.5 rounded-xl border-2 border-base-200 text-sm group/chap hover:border-primary/40 shadow-2xs transition-all cursor-pointer"
     id="chapter-{{ ch.id }}"
     x-data="{ editingName: false, editingDesc: false }">
  <div class="flex items-center gap-3 min-w-0 flex-1">
    <div class="w-8 h-8 rounded-lg bg-emerald-500/15 text-emerald-600 border border-emerald-500/25 flex items-center justify-center shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
    </div>
    <form enctype="multipart/form-data" data-no-card-nav class="relative group/thumb shrink-0" @click.stop>
      <input type="file" name="thumbnail" accept="image/*" class="hidden" x-ref="thumbInput"
             hx-post="/admin/curriculum/chapters/{{ ch.id }}/thumbnail" 
             hx-target="#chapter-{{ ch.id }}" 
             hx-swap="outerHTML" 
             hx-encoding="multipart/form-data">
      {% if ch.thumbnail_url %}
      <div class="avatar relative">
        <div class="w-8 h-8 rounded-lg cursor-zoom-in border border-base-300 hover:border-emerald-500 transition-all overflow-hidden" @click="$dispatch('open-image-modal', '{{ ch.thumbnail_url }}')">
          <img src="{{ ch.thumbnail_url }}" alt="{{ ch.name }}" class="object-cover" />
        </div>
        <button type="button" @click="$refs.thumbInput.click()" class="absolute -top-1 -right-1 w-4 h-4 bg-emerald-600 rounded-full flex items-center justify-center text-white shadow hover:bg-emerald-500 z-10" title="Edit Thumbnail">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-2.5 w-2.5" viewBox="0 0 20 20" fill="currentColor"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" /></svg>
        </button>
      </div>
      {% else %}
      <button type="button" @click="$refs.thumbInput.click()" class="w-8 h-8 rounded-lg bg-base-200 flex items-center justify-center text-base-content/50 hover:text-emerald-600 hover:bg-emerald-500/10 transition-all border border-dashed border-base-300" title="Add Thumbnail">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
      </button>
      {% endif %}
    </form>
    <div class="flex flex-col min-w-0 flex-1">
      <div class="flex items-center gap-2 flex-wrap min-w-0">
        <span x-show="!editingName" class="text-base-content font-black group-hover/chap:text-emerald-700 transition-colors break-words">{{ ch.name }}</span>
        <button type="button" x-show="!editingName" @click.stop="editingName = true" class="btn btn-xs btn-ghost btn-circle h-7 w-7 min-h-0 text-base-content/55 hover:text-emerald-600" title="Rename Chapter">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
        </button>
        <form x-show="editingName" data-no-card-nav @click.stop hx-post="/admin/curriculum/chapters/{{ ch.id }}/rename" hx-target="#chapter-{{ ch.id }}" hx-swap="outerHTML" class="flex flex-wrap gap-2 items-center w-full min-w-0">
          <input type="text" name="name" value="{{ ch.name }}" class="input input-sm input-bordered bg-base-100 text-base-content font-bold min-w-0 flex-1 max-w-full" required>
          <button type="submit" class="btn btn-sm btn-primary text-slate-900 font-black">Save</button>
          <button type="button" @click="editingName = false" class="btn btn-sm btn-ghost">Cancel</button>
        </form>
      </div>
      <!-- Chapter Description row -->
      <div class="flex items-center gap-1.5 mt-0.5 min-w-0">
        <span x-show="!editingDesc" class="text-[11px] font-medium text-base-content/55 break-words min-w-0">
          {% if ch.description %}{{ ch.description[:60] }}{% if ch.description|length > 60 %}...{% endif %}{% else %}<em class="text-base-content/35">No description</em>{% endif %}
        </span>
        <button type="button" x-show="!editingDesc" @click.stop="editingDesc = true" class="btn btn-xs btn-ghost btn-circle h-7 w-7 min-h-0 text-base-content/40 hover:text-emerald-600 shrink-0" title="Edit Chapter Description">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
        </button>
        <form x-show="editingDesc" data-no-card-nav @click.stop hx-post="/admin/curriculum/chapters/{{ ch.id }}/description" hx-target="#chapter-{{ ch.id }}" hx-swap="outerHTML" class="flex gap-2 items-start w-full max-w-xs min-w-0 mt-1">
          <textarea name="description" class="textarea textarea-xs textarea-bordered bg-base-100 text-base-content resize-none h-12 flex-1 min-w-0" placeholder="Chapter description (optional)">{{ ch.description or '' }}</textarea>
          <div class="flex flex-col gap-1">
            <button type="submit" class="btn btn-xs btn-primary text-slate-900 font-black">Save</button>
            <button type="button" @click="editingDesc = false" class="btn btn-xs btn-ghost btn-circle" title="Cancel">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto justify-end">
    <!-- Draft / Published Toggle -->
    <label class="cursor-pointer flex items-center gap-2 bg-base-200 px-2.5 py-1.5 min-h-[36px] rounded-lg border border-base-300">
      <span class="text-[10px] uppercase tracking-wider font-black {{ 'text-emerald-600' if ch.status == 'published' else 'text-base-content/40' }}">
        {{ ch.status }}
      </span> 
      <input type="checkbox" class="toggle toggle-xs {{ 'toggle-success' if ch.status == 'published' else '' }}" 
          {{ 'checked' if ch.status == 'published' else '' }}
          hx-post="/admin/curriculum/chapters/{{ ch.id }}/status"
          hx-vals='{"status": "{{ ch.status }}"}'
          hx-target="#chapter-{{ ch.id }}"
          hx-swap="outerHTML" />
    </label>
    
    <a href="/admin/curriculum/chapters/{{ ch.id }}" class="btn btn-xs btn-primary text-slate-900 font-black rounded-lg h-9 min-h-0 px-3 tactile-btn border border-amber-600/30">
      Edit Studio →
    </a>
    <button type="button"
        hx-delete="/admin/curriculum/chapters/{{ ch.id }}" 
        hx-target="#chapter-{{ ch.id }}" 
        hx-swap="outerHTML" 
        class="btn btn-xs bg-error/10 text-error hover:bg-error hover:text-white border-none h-9 min-h-0 rounded-lg font-bold px-2.5"
        hx-confirm="Delete this chapter and all its contents?">
      Delete
    </button>
  </div>
</div>
